
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DZcord</title>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    background: #111318;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

button,
input {
    font-family: inherit;
}

#login {
    position: fixed;
    inset: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #111318;
}

.login-box {
    width: 380px;
    max-width: 90%;
    background: #191c22;
    padding: 30px;
    border-radius: 15px;
    box-shadow: 0 10px 40px #0008;
}

.login-box h1 {
    text-align: center;
    margin-top: 0;
}

.login-box input {
    width: 100%;
    padding: 13px;
    margin-top: 10px;
    border: 0;
    outline: none;
    border-radius: 8px;
    background: #282c35;
    color: white;
}

.login-box button {
    width: 100%;
    margin-top: 15px;
    padding: 13px;
    border: 0;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    font-weight: bold;
    cursor: pointer;
}

#app {
    display: none;
    width: 100vw;
    height: 100vh;
}

#sidebar {
    width: 240px;
    background: #191b20;
    padding: 15px;
    display: flex;
    flex-direction: column;
}

.server-name {
    font-size: 20px;
    font-weight: bold;
    padding-bottom: 15px;
    border-bottom: 1px solid #30333b;
}

#users {
    margin-top: 15px;
    overflow-y: auto;
    flex: 1;
}

.user {
    padding: 8px;
    color: #bbb;
    border-radius: 6px;
}

.user.me {
    color: white;
    background: #2b2f38;
}

#main {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
}

#topbar {
    height: 55px;
    background: #1d2026;
    display: flex;
    align-items: center;
    padding: 0 15px;
    gap: 15px;
}

#roomInfo {
    color: #aaa;
    font-size: 14px;
}

#videos {
    flex: 1;
    padding: 15px;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
    gap: 15px;
    overflow-y: auto;
    align-content: start;
}

.video-card {
    position: relative;
    background: #08090b;
    border-radius: 12px;
    overflow: hidden;
    min-height: 220px;
    border: 1px solid #292c33;
}

.video-card video {
    width: 100%;
    height: 100%;
    min-height: 220px;
    object-fit: contain;
    background: #050505;
}

.video-name {
    position: absolute;
    left: 10px;
    bottom: 10px;
    padding: 6px 9px;
    border-radius: 6px;
    background: #000b;
    font-size: 13px;
}

.live-badge {
    position: absolute;
    right: 10px;
    top: 10px;
    background: #ed4245;
    padding: 5px 8px;
    border-radius: 6px;
    font-size: 11px;
    font-weight: bold;
}

#chat {
    height: 230px;
    background: #15171c;
    border-top: 1px solid #292c33;
    display: flex;
    flex-direction: column;
}

#messages {
    flex: 1;
    overflow-y: auto;
    padding: 10px 15px;
}

.message {
    margin-bottom: 7px;
}

.message-name {
    font-weight: bold;
    color: #7289da;
}

.system {
    color: #888;
    font-style: italic;
}

#chatForm {
    display: flex;
    padding: 10px;
    gap: 8px;
}

#chatInput {
    flex: 1;
    background: #292c33;
    border: 0;
    outline: none;
    color: white;
    padding: 12px;
    border-radius: 7px;
}

#chatForm button {
    background: #5865f2;
    border: 0;
    color: white;
    padding: 0 18px;
    border-radius: 7px;
    cursor: pointer;
}

#controls {
    height: 70px;
    background: #111318;
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 10px;
}

.control {
    border: 0;
    border-radius: 50%;
    width: 48px;
    height: 48px;
    background: #292c33;
    color: white;
    cursor: pointer;
    font-size: 19px;
}

.control.active {
    background: #5865f2;
}

.control.danger {
    background: #ed4245;
}

#status {
    position: fixed;
    right: 15px;
    top: 70px;
    padding: 8px 12px;
    border-radius: 8px;
    background: #000b;
    color: #aaa;
    font-size: 12px;
    z-index: 50;
}

@media (max-width: 700px) {
    #sidebar {
        display: none;
    }

    #videos {
        grid-template-columns: 1fr;
    }

    #chat {
        height: 180px;
    }
}
</style>
</head>

<body>

<div id="login">
    <div class="login-box">
        <h1>🌐 DZcord</h1>

        <input id="nameInput" placeholder="Seu nome">

        <input id="roomInput" placeholder="Código da sala">

        <button id="joinBtn">Entrar na sala</button>

        <div id="loginStatus"
             style="text-align:center;color:#888;margin-top:12px;font-size:13px;">
        </div>
    </div>
</div>


<div id="app">

    <aside id="sidebar">

        <div class="server-name">
            🟣 DZcord
        </div>

        <div style="color:#777;font-size:12px;margin-top:15px;">
            PARTICIPANTES
        </div>

        <div id="users"></div>

    </aside>


    <main id="main">

        <div id="topbar">

            <strong>💬 Sala</strong>

            <span id="roomInfo"></span>

        </div>


        <div id="status">
            Conectando...
        </div>


        <section id="videos">

            <!-- vídeos entram aqui -->

        </section>


        <section id="chat">

            <div id="messages"></div>

            <form id="chatForm">

                <input
                    id="chatInput"
                    autocomplete="off"
                    placeholder="Digite uma mensagem..."
                >

                <button>Enviar</button>

            </form>

        </section>


        <div id="controls">

            <button
                class="control"
                id="micBtn"
                title="Microfone">
                🎤
            </button>

            <button
                class="control"
                id="cameraBtn"
                title="Câmera">
                📷
            </button>

            <button
                class="control"
                id="screenBtn"
                title="Compartilhar tela">
                🖥️
            </button>

            <button
                class="control danger"
                id="leaveBtn"
                title="Sair">
                ☎
            </button>

        </div>

    </main>

</div>


<script>
/* =========================================================
   DZCORD
   ========================================================= */

const $ = id => document.getElementById(id);


/* ---------------------------------------------------------
   ESTADO
   --------------------------------------------------------- */

let peer = null;

let myPeerId = null;
let myName = "";
let room = "";

let isHost = false;

let hostId = "";

let hostConnection = null;


/* Participantes */

const participants = new Map();


/* Conexões de dados */

const dataConnections = new Map();


/* Chamadas WebRTC */

const mediaCalls = new Map();


/* Streams */

let micStream = null;
let cameraStream = null;
let screenStream = null;


/* Estado dos dispositivos */

let micEnabled = false;
let cameraEnabled = false;
let screenEnabled = false;


/* ---------------------------------------------------------
   UTILIDADES
   --------------------------------------------------------- */

function safeRoom(roomName) {
    return roomName
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g, "-");
}


function getHostId(roomName) {
    return "dzcord-host-" + safeRoom(roomName);
}


function setStatus(text) {
    $("status").textContent = text;
}


function addSystemMessage(text) {

    const div = document.createElement("div");

    div.className = "message system";

    div.textContent = "⚙️ " + text;

    $("messages").appendChild(div);

    $("messages").scrollTop =
        $("messages").scrollHeight;
}


function addMessage(name, text) {

    const div = document.createElement("div");

    div.className = "message";

    const nameSpan =
        document.createElement("span");

    nameSpan.className = "message-name";

    nameSpan.textContent = name + ": ";

    const textSpan =
        document.createElement("span");

    textSpan.textContent = text;

    div.appendChild(nameSpan);

    div.appendChild(textSpan);

    $("messages").appendChild(div);

    $("messages").scrollTop =
        $("messages").scrollHeight;
}


/* ---------------------------------------------------------
   PARTICIPANTES
   --------------------------------------------------------- */

function updateUserList() {

    const box = $("users");

    box.innerHTML = "";

    for (const [id, name] of participants) {

        const div =
            document.createElement("div");

        div.className =
            "user" +
            (id === myPeerId ? " me" : "");

        div.textContent =
            (id === myPeerId ? "🟢 " : "⚪ ") +
            name;

        box.appendChild(div);
    }
}


function addParticipant(id, name) {

    if (!id) return;

    participants.set(id, name || "Usuário");

    updateUserList();
}


/* ---------------------------------------------------------
   VÍDEOS
   --------------------------------------------------------- */

function removeVideo(id) {

    const card =
        document.getElementById("video-" + id);

    if (card) {
        card.remove();
    }
}


function showRemoteStream(id, stream) {

    let card =
        document.getElementById("video-" + id);


    if (!card) {

        card =
            document.createElement("div");

        card.className = "video-card";

        card.id = "video-" + id;


        const video =
            document.createElement("video");

        video.autoplay = true;

        video.playsInline = true;

        video.controls = false;


        const name =
            participants.get(id) ||
            "Usuário";


        const label =
            document.createElement("div");

        label.className = "video-name";

        label.textContent = name;


        const badge =
            document.createElement("div");

        badge.className = "live-badge";

        badge.textContent = "AO VIVO";


        card.appendChild(video);

        card.appendChild(label);

        card.appendChild(badge);


        $("videos").appendChild(card);
    }


    const video =
        card.querySelector("video");


    if (video.srcObject !== stream) {

        video.srcObject = stream;

        video.play().catch(() => {});
    }
}


function showLocalStream(stream) {

    if (!stream) {

        removeVideo("local");

        return;
    }


    let card =
        document.getElementById("video-local");


    if (!card) {

        card =
            document.createElement("div");

        card.className =
            "video-card";

        card.id =
            "video-local";


        const video =
            document.createElement("video");

        video.autoplay = true;

        video.muted = true;

        video.playsInline = true;


        const label =
            document.createElement("div");

        label.className =
            "video-name";

        label.textContent =
            myName + " (Você)";


        const badge =
            document.createElement("div");

        badge.className =
            "live-badge";

        badge.textContent =
            "TRANSMITINDO";


        card.appendChild(video);

        card.appendChild(label);

        card.appendChild(badge);


        $("videos").prepend(card);
    }


    const video =
        card.querySelector("video");

    video.srcObject = stream;

    video.play().catch(() => {});
}


/* ---------------------------------------------------------
   STREAM DE SAÍDA
   --------------------------------------------------------- */

function getOutgoingStream() {

    const stream =
        new MediaStream();


    /*
       Microfone
    */

    if (micEnabled && micStream) {

        micStream
            .getAudioTracks()
            .forEach(track => {
                stream.addTrack(track);
            });
    }


    /*
       Tela tem prioridade sobre câmera
    */

    if (screenEnabled && screenStream) {

        screenStream
            .getVideoTracks()
            .forEach(track => {
                stream.addTrack(track);
            });


        /*
           Se o compartilhamento tiver áudio
           e o microfone não estiver ligado,
           enviaremos o áudio da tela.
        */

        if (!micEnabled) {

            screenStream
                .getAudioTracks()
                .forEach(track => {
                    stream.addTrack(track);
                });
        }

    } else if (cameraEnabled && cameraStream) {

        cameraStream
            .getVideoTracks()
            .forEach(track => {
                stream.addTrack(track);
            });
    }


    return stream.getTracks().length
        ? stream
        : null;
}


/* ---------------------------------------------------------
   CHAMADAS
   --------------------------------------------------------- */

function setupCall(call) {

    const id = call.peer;


    call.on("stream", remoteStream => {

        console.log(
            "STREAM RECEBIDO DE:",
            id,
            remoteStream
        );


        showRemoteStream(
            id,
            remoteStream
        );


        setStatus(
            "Recebendo transmissão de " +
            (participants.get(id) || "usuário")
        );
    });


    call.on("close", () => {

        if (mediaCalls.get(id) === call) {
            mediaCalls.delete(id);
        }

        removeVideo(id);
    });


    call.on("error", err => {

        console.error(
            "Erro na chamada:",
            err
        );

        if (mediaCalls.get(id) === call) {
            mediaCalls.delete(id);
        }
    });
}


/* ---------------------------------------------------------
   FAZER CHAMADA
   --------------------------------------------------------- */

function callPeer(id) {

    if (!peer) return;

    if (!id) return;

    if (id === myPeerId) return;


    const stream =
        getOutgoingStream();


    if (!stream) return;


    /*
       Já existe chamada?
    */

    if (mediaCalls.has(id)) {
        return;
    }


    console.log(
        "Chamando:",
        id
    );


    try {

        const call =
            peer.call(
                id,
                stream,
                {
                    metadata: {
                        name: myName
                    }
                }
            );


        if (!call) {
            console.error(
                "PeerJS não criou a chamada."
            );

            return;
        }


        mediaCalls.set(
            id,
            call
        );


        setupCall(call);

    } catch (err) {

        console.error(
            "Erro ao chamar:",
            err
        );
    }
}


/* ---------------------------------------------------------
   RENEGOCIAR TODAS AS CHAMADAS
   --------------------------------------------------------- */

function renegotiateAll() {

    console.log(
        "Renegociando mídia..."
    );


    /*
       Fecha as chamadas antigas.
       Isso é proposital:
       garante que câmera/tela nova
       seja enviada corretamente.
    */

    for (const call of mediaCalls.values()) {

        try {
            call.close();
        } catch {}
    }


    mediaCalls.clear();


    const stream =
        getOutgoingStream();


    /*
       Prévia local
    */

    showLocalStream(stream);


    if (!stream) {

        setStatus(
            "Mídia desligada"
        );

        return;
    }


    /*
       Chama todos os participantes.
    */

    for (const id of participants.keys()) {

        if (id !== myPeerId) {

            setTimeout(() => {
                callPeer(id);
            }, 150);
        }
    }
}


/* ---------------------------------------------------------
   CHAMADA RECEBIDA
   --------------------------------------------------------- */

function handleIncomingCall(call) {

    const remoteId =
        call.peer;


    console.log(
        "CHAMADA RECEBIDA DE:",
        remoteId
    );


    /*
       Se já existe uma chamada,
       mantemos apenas uma.
    */

    if (mediaCalls.has(remoteId)) {

        const existing =
            mediaCalls.get(remoteId);


        /*
           Se nós somos o ID menor,
           mantemos nossa chamada.
        */

        if (
            String(myPeerId) <
            String(remoteId)
        ) {

            call.close();

            return;

        } else {

            try {
                existing.close();
            } catch {}

            mediaCalls.delete(
                remoteId
            );
        }
    }


    const outgoing =
        getOutgoingStream();


    try {

        /*
           Mesmo sem stream local,
           podemos receber a tela do amigo.
        */

        if (outgoing) {
            call.answer(outgoing);
        } else {
            call.answer();
        }


        mediaCalls.set(
            remoteId,
            call
        );


        setupCall(call);


    } catch (err) {

        console.error(
            "Erro ao responder chamada:",
            err
        );
    }
}


/* ---------------------------------------------------------
   DADOS / CHAT
   --------------------------------------------------------- */

function sendToHost(data) {

    if (
        hostConnection &&
        hostConnection.open
    ) {

        hostConnection.send(data);

        return true;
    }

    return false;
}


function broadcast(data) {

    for (
        const connection
        of dataConnections.values()
    ) {

        if (connection.open) {

            try {
                connection.send(data);
            } catch {}
        }
    }
}


/* ---------------------------------------------------------
   CONEXÃO DE DADOS
   --------------------------------------------------------- */

function handleDataConnection(conn) {

    console.log(
        "Conexão de dados:",
        conn.peer
    );


    dataConnections.set(
        conn.peer,
        conn
    );


    conn.on("open", () => {

        console.log(
            "Data aberta:",
            conn.peer
        );


        /*
           Se for host recebendo cliente.
        */

        if (isHost) {

            conn.send({
                type: "welcome",
                hostId: hostId,
                roster:
                    Array.from(
                        participants.entries()
                    )
            });
        }
    });


    conn.on("data", data => {

        handleDataMessage(
            conn,
            data
        );
    });


    conn.on("close", () => {

        dataConnections.delete(
            conn.peer
        );


        if (isHost) {

            participants.delete(
                conn.peer
            );

            updateUserList();


            broadcast({
                type: "user-left",
                id: conn.peer
            });


            removeVideo(
                conn.peer
            );
        }
    });


    conn.on("error", err => {

        console.error(
            "Erro data:",
            err
        );
    });
}


/* ---------------------------------------------------------
   MENSAGENS DATA
   --------------------------------------------------------- */

function handleDataMessage(
    conn,
    data
) {

    if (!data || !data.type) {
        return;
    }


    /* ---------------- JOIN ---------------- */

    if (
        isHost &&
        data.type === "join"
    ) {

        const id =
            conn.peer;

        const name =
            data.name ||
            "Usuário";


        addParticipant(
            id,
            name
        );


        /*
           Envia lista completa ao novo usuário.
        */

        conn.send({
            type: "roster",
            roster:
                Array.from(
                    participants.entries()
                )
        });


        /*
           Avisa os outros.
        */

        broadcast({
            type: "user-joined",
            id: id,
            name: name
        });


        addSystemMessage(
            name +
            " entrou na sala."
        );

        return;
    }


    /* ---------------- ROSTER ---------------- */

    if (
        data.type === "roster"
    ) {

        participants.clear();


        for (
            const item
            of data.roster || []
        ) {

            addParticipant(
                item[0],
                item[1]
            );
        }


        updateUserList();


        /*
           Se já temos mídia,
           chama os participantes.
        */

        if (getOutgoingStream()) {
            renegotiateAll();
        }

        return;
    }


    /* ---------------- USER JOINED ---------------- */

    if (
        data.type === "user-joined"
    ) {

        addParticipant(
            data.id,
            data.name
        );


        addSystemMessage(
            data.name +
            " entrou na sala."
        );


        /*
           Se temos mídia,
           chama o novo usuário.
        */

        if (
            getOutgoingStream() &&
            data.id !== myPeerId
        ) {

            setTimeout(() => {

                callPeer(
                    data.id
                );

            }, 500);
        }

        return;
    }


    /* ---------------- USER LEFT ---------------- */

    if (
        data.type === "user-left"
    ) {

        const name =
            participants.get(
                data.id
            ) ||
            "Usuário";


        participants.delete(
            data.id
        );


        updateUserList();


        removeVideo(
            data.id
        );


        const call =
            mediaCalls.get(
                data.id
            );


        if (call) {

            try {
                call.close();
            } catch {}

            mediaCalls.delete(
                data.id
            );
        }


        addSystemMessage(
            name +
            " saiu da sala."
        );

        return;
    }


    /* ---------------- CHAT ---------------- */

    if (
        isHost &&
        data.type === "chat"
    ) {

        broadcast(data);

        return;
    }


    if (
        data.type === "chat"
    ) {

        addMessage(
            data.name,
            data.text
        );

        return;
    }
}


/* ---------------------------------------------------------
   HOST
   --------------------------------------------------------- */

function becomeHost() {

    isHost = true;

    hostId =
        getHostId(room);


    console.log(
        "Criando HOST:",
        hostId
    );


    peer =
        new Peer(hostId);


    peer.on("open", id => {

        myPeerId = id;


        addParticipant(
            myPeerId,
            myName
        );


        $("login").style.display =
            "none";

        $("app").style.display =
            "flex";


        $("roomInfo").textContent =
            "Código: " + room;


        setStatus(
            "Sala criada"
        );


        addSystemMessage(
            "Você criou a sala."
        );


        console.log(
            "HOST ONLINE:",
            id
        );
    });


    peer.on(
        "connection",
        handleDataConnection
    );


    peer.on(
        "call",
        handleIncomingCall
    );


    peer.on("error", err => {

        console.error(
            "Erro HOST:",
            err
        );


        setStatus(
            "Erro: " +
            (err.type || err.message)
        );
    });


    peer.on("disconnected", () => {

        setStatus(
            "Desconectado. Tentando reconectar..."
        );


        try {
            peer.reconnect();
        } catch {}
    });
}


/* ---------------------------------------------------------
   CLIENTE
   --------------------------------------------------------- */

function becomeClient() {

    isHost = false;

    hostId =
        getHostId(room);


    console.log(
        "Entrando como cliente.",
        "Host:",
        hostId
    );


    peer =
        new Peer();


    peer.on("open", id => {

        myPeerId = id;


        $("login").style.display =
            "none";

        $("app").style.display =
            "flex";


        $("roomInfo").textContent =
            "Código: " + room;


        setStatus(
            "Conectando à sala..."
        );


        connectToHost();
    });


    peer.on(
        "call",
        handleIncomingCall
    );


    peer.on(
        "connection",
        handleDataConnection
    );


    peer.on("error", err => {

        console.error(
            "Erro cliente:",
            err
        );


        setStatus(
            "Erro: " +
            (err.type || err.message)
        );
    });


    peer.on("disconnected", () => {

        setStatus(
            "Desconectado..."
        );


        try {
            peer.reconnect();
        } catch {}
    });
}


/* ---------------------------------------------------------
   CONECTAR AO HOST
   --------------------------------------------------------- */

function connectToHost() {

    console.log(
        "Conectando ao host:",
        hostId
    );


    hostConnection =
        peer.connect(
            hostId,
            {
                reliable: true
            }
        );


    hostConnection.on("open", () => {

        console.log(
            "Conectado ao host."
        );


        setStatus(
            "Conectado"
        );


        hostConnection.send({
            type: "join",
            name: myName
        });
    });


    hostConnection.on("data", data => {

        handleDataMessage(
            hostConnection,
            data
        );
    });


    hostConnection.on("close", () => {

        setStatus(
            "Conexão com o host perdida."
        );
    });


    hostConnection.on("error", err => {

        console.error(
            "Erro host:",
            err
        );
    });
}

$("joinBtn").onclick =
    () => {

        myName =
            $("nameInput")
                .value
                .trim();


        room =
            $("roomInput")
                .value
                .trim();


        if (!myName) {

            $("loginStatus")
                .textContent =
                "Digite seu nome.";

            return;
        }


        if (!room) {

            $("loginStatus")
                .textContent =
                "Digite o código da sala.";

            return;
        }


        $("loginStatus")
            .textContent =
            "Conectando...";


        const wantedHost =
            getHostId(room);


        /*
           Primeiro tentamos abrir
           o ID do host.

           Se conseguir, a sala já existe.
        */

        const testPeer =
            new Peer();


        let finished = false;


        testPeer.on("open", () => {

            testPeer.destroy();


            if (!finished) {

                finished = true;

                becomeHost();
            }
        });


        testPeer.on("error", err => {

            console.log(
                "Teste de host:",
                err.type
            );


            try {
                testPeer.destroy();
            } catch {}


            if (!finished) {

                finished = true;

                becomeClient();
            }
        });


        /*
           Timeout para evitar ficar preso.
        */

        setTimeout(() => {

            if (!finished) {

                finished = true;


                try {
                    testPeer.destroy();
                } catch {}


                becomeClient();
            }

        }, 2500);
    };

/* ---------------------------------------------------------
   COMPARTILHAR TELA
   --------------------------------------------------------- */

$("screenBtn").onclick =
    async () => {

        /*
           Se já está transmitindo,
           botão para a transmissão.
        */

        if (screenEnabled) {

            stopScreenShare();

            return;
        }


        try {

            /*
               IMPORTANTE:
               getDisplayMedia precisa
               ser chamado diretamente
               pelo clique do usuário.
            */

            const stream =
                await navigator.mediaDevices
                    .getDisplayMedia({
                        video: {
                            cursor: "always"
                        },
                        audio: true
                    });


            /*
               Guarda exatamente esta stream.
            */

            screenStream =
                stream;


            screenEnabled =
                true;


            $("screenBtn")
                .classList
                .add("active");


            /*
               Mostra imediatamente
               a própria tela.
            */

            showLocalStream(
                getOutgoingStream()
            );


            addSystemMessage(
                "Você começou a transmitir a tela."
            );


            setStatus(
                "🖥️ Transmitindo sua tela"
            );


            /*
               O navegador dispara onended
               quando o usuário clica em
               "Parar compartilhamento"
               na interface do Chrome.
            */

            const videoTrack =
                stream.getVideoTracks()[0];


            if (videoTrack) {

                videoTrack.onended =
                    () => {

                        /*
                           Só encerra se esta
                           ainda for a stream atual.
                        */

                        if (
                            screenStream ===
                            stream
                        ) {

                            stopScreenShare(
                                false
                            );
                        }
                    };
            }


            /*
               AGORA envia a tela
               para todos os participantes.
            */

            renegotiateAll();


        } catch (err) {

            console.error(
                "Erro no compartilhamento:",
                err
            );


            /*
               Cancelar o seletor do Chrome
               não é erro real.
            */

            if (
                err.name ===
                "AbortError"
            ) {

                setStatus(
                    "Compartilhamento cancelado."
                );

                return;
            }


            alert(
                "Erro ao compartilhar a tela:\n" +
                err.message
            );
        }
    };


/* ---------------------------------------------------------
   PARAR TELA
   --------------------------------------------------------- */

function stopScreenShare(
    fromButton = true
) {

    const oldStream =
        screenStream;


    screenStream = null;

    screenEnabled = false;


    $("screenBtn")
        .classList
        .remove("active");


    if (oldStream) {

        oldStream
            .getTracks()
            .forEach(track => {

                /*
                   Evita problemas com
                   track já encerrada.
                */

                try {
                    track.stop();
                } catch {}
            });
    }


    /*
       Volta para câmera/microfone
       ou simplesmente remove a prévia.
    */

    const stream =
        getOutgoingStream();


    showLocalStream(
        stream
    );


    renegotiateAll();


    addSystemMessage(
        "Você parou a transmissão."
    );


    setStatus(
        "Transmissão encerrada."
    );
}

$("chatForm").onsubmit =
    e => {

        e.preventDefault();


        const text =
            $("chatInput")
                .value
                .trim();


        if (!text) return;


        const data = {
            type: "chat",
            name: myName,
            text: text
        };


        /*
           Host pode transmitir
           diretamente.
        */

        if (isHost) {

            broadcast(data);

            addMessage(
                myName,
                text
            );

        } else {

            /*
               Cliente manda ao host.
            */

            if (!sendToHost(data)) {

                addSystemMessage(
                    "Não conectado ao host."
                );

                return;
            }
        }


        $("chatInput").value = "";
    };


/* ---------------------------------------------------------
   SAIR
   --------------------------------------------------------- */

$("leaveBtn").onclick =
    () => {

        /*
           Fecha chamadas.
        */

        for (
            const call
            of mediaCalls.values()
        ) {

            try {
                call.close();
            } catch {}
        }


        mediaCalls.clear();


        /*
           Para streams.
        */

        if (micStream) {

            micStream
                .getTracks()
                .forEach(t => {
                    try {
                        t.stop();
                    } catch {}
                });
        }


        if (cameraStream) {

            cameraStream
                .getTracks()
                .forEach(t => {
                    try {
                        t.stop();
                    } catch {}
                });
        }


        if (screenStream) {

            screenStream
                .getTracks()
                .forEach(t => {
                    try {
                        t.stop();
                    } catch {}
                });
        }


        /*
           Fecha PeerJS.
        */

        try {
            if (peer) peer.destroy();
        } catch {}


        location.reload();
    };
