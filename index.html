<script>

/* =========================================================
   ESTADO
========================================================= */

let peer = null;

let myPeerId = null;
let myName = "";
let room = "";

let isHost = false;

let hostPeerId = null;
let hostConnection = null;

const participants = new Map();
const dataConnections = new Map();
const mediaCalls = new Map();

let micStream = null;
let cameraStream = null;
let screenStream = null;

let micEnabled = false;
let cameraEnabled = false;
let screenEnabled = false;


/* =========================================================
   ELEMENTOS
========================================================= */

const login = document.getElementById("login");
const app = document.getElementById("app");

const nameInput = document.getElementById("nameInput");
const roomInput = document.getElementById("roomInput");

const joinBtn = document.getElementById("joinBtn");

const roomName = document.getElementById("roomName");
const statusEl = document.getElementById("status");

const participantsEl = document.getElementById("participants");
const messagesEl = document.getElementById("messages");

const videosEl = document.getElementById("videos");

const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

const micBtn = document.getElementById("micBtn");
const cameraBtn = document.getElementById("cameraBtn");

const screenBtn = document.getElementById("screenBtn");
const stopScreenBtn = document.getElementById("stopScreenBtn");


/* =========================================================
   UTILIDADES
========================================================= */

function addMessage(name, text, system = false) {

    const div = document.createElement("div");

    div.className = "message";

    if (system) {

        div.innerHTML =
            `<span class="system">${escapeHTML(text)}</span>`;

    } else {

        div.innerHTML =
            `<span class="name">${escapeHTML(name)}</span>
             ${escapeHTML(text)}`;

    }

    messagesEl.appendChild(div);

    document.querySelector(".content").scrollTop =
        document.querySelector(".content").scrollHeight;
}


function escapeHTML(text) {

    return String(text)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
}


/*
   Gera um ID determinístico para a sala.

   Assim todos sabem qual é o PeerJS ID do HOST
   sem precisar de um servidor próprio.
*/
function roomHostId(roomName) {

    let hash = 2166136261;

    for (let i = 0; i < roomName.length; i++) {

        hash ^= roomName.charCodeAt(i);

        hash +=
            (hash << 1) +
            (hash << 4) +
            (hash << 7) +
            (hash << 8) +
            (hash << 24);
    }

    hash >>>= 0;

    return "dzcord-host-" + hash.toString(36);
}


/* =========================================================
   LOGIN
========================================================= */

joinBtn.onclick = joinRoom;

nameInput.addEventListener("keydown", e => {

    if (e.key === "Enter")
        roomInput.focus();

});

roomInput.addEventListener("keydown", e => {

    if (e.key === "Enter")
        joinRoom();

});


async function joinRoom() {

    myName = nameInput.value.trim();
    room = roomInput.value.trim();

    if (!myName || !room) {

        alert("Digite seu nome e o nome da sala.");

        return;
    }

    login.style.display = "none";
    app.style.display = "flex";

    roomName.textContent = room;

    statusEl.textContent = "Conectando...";

    hostPeerId = roomHostId(room);

    /*
       Primeiro tentamos assumir o ID do HOST.

       Se já existir, significa que alguém já é o host.
    */

    createPeerAsHost();

}


/* =========================================================
   CRIAÇÃO DO PEER
========================================================= */

function createPeerAsHost() {

    isHost = true;

    peer = new Peer(hostPeerId);

    peer.on("open", id => {

        myPeerId = id;

        participants.set(myPeerId, myName);

        updateParticipants();

        statusEl.textContent = "Online";

        addMessage(
            "Sistema",
            myName + " entrou na sala."
        );

    });

    peer.on("connection", handleConnection);

    peer.on("call", handleIncomingCall);

    peer.on("error", error => {

        /*
           O ID já está sendo usado.
           Então essa pessoa será participante normal.
        */

        if (
            error.type === "unavailable-id" ||
            error.type === "id-taken"
        ) {

            try {
                peer.destroy();
            } catch (_) {}

            createPeerAsClient();

            return;
        }

        console.error("PeerJS:", error);

        statusEl.textContent =
            "Erro: " + error.type;
    });

}


function createPeerAsClient() {

    isHost = false;

    peer = new Peer();

    peer.on("open", id => {

        myPeerId = id;

        statusEl.textContent =
            "Conectando à sala...";

        connectToHost();

    });

    peer.on("connection", handleConnection);

    peer.on("call", handleIncomingCall);

    peer.on("error", error => {

        console.error(error);

        statusEl.textContent =
            "Erro de conexão";
    });

}


/* =========================================================
   CONEXÃO COM HOST
========================================================= */

function connectToHost() {

    const conn = peer.connect(
        hostPeerId,
        {
            reliable: true
        }
    );

    hostConnection = conn;

    conn.on("open", () => {

        conn.send({
            type: "join",
            id: myPeerId,
            name: myName
        });

        statusEl.textContent = "Online";

    });

    conn.on("data", data => {

        handleHostMessage(data);

    });

    conn.on("close", () => {

        statusEl.textContent =
            "Host desconectado";

        addMessage(
            "Sistema",
            "O host saiu da sala."
        );

    });

    conn.on("error", error => {

        console.error(error);

    });

}


/* =========================================================
   CONEXÕES DE DADOS
========================================================= */

function handleConnection(conn) {

    conn.on("open", () => {

        dataConnections.set(
            conn.peer,
            conn
        );

    });

    conn.on("data", data => {

        if (isHost) {

            handleHostData(conn, data);

        }

    });

    conn.on("close", () => {

        const id = conn.peer;

        dataConnections.delete(id);

        if (isHost && participants.has(id)) {

            const name = participants.get(id);

            participants.delete(id);

            broadcast({
                type: "user-left",
                id: id,
                name: name
            });

            updateParticipants();

            addMessage(
                "Sistema",
                name + " saiu da sala."
            );
        }

    });

}


/* =========================================================
   MENSAGENS DO HOST
========================================================= */

function handleHostData(conn, data) {

    if (!data || !data.type)
        return;


    /* NOVO USUÁRIO */

    if (data.type === "join") {

        participants.set(
            data.id,
            data.name
        );

        dataConnections.set(
            conn.peer,
            conn
        );

        /*
           Envia a lista atual para o novo usuário.
        */

        conn.send({
            type: "roster",
            participants:
                Array.from(participants.entries())
                    .map(([id, name]) => ({
                        id,
                        name
                    }))
        });


        /*
           Avisa os outros.
        */

        broadcastExcept(conn.peer, {
            type: "user-joined",
            id: data.id,
            name: data.name
        });


        updateParticipants();

        addMessage(
            "Sistema",
            data.name + " entrou na sala."
        );

        return;
    }


    /* CHAT */

    if (data.type === "chat") {

        broadcast({
            type: "chat",
            name: data.name,
            text: data.text
        });

        addMessage(
            data.name,
            data.text
        );

        return;
    }

}


/* =========================================================
   MENSAGENS RECEBIDAS DO HOST
========================================================= */

function handleHostMessage(data) {

    if (!data || !data.type)
        return;


    if (data.type === "roster") {

        participants.clear();

        data.participants.forEach(user => {

            participants.set(
                user.id,
                user.name
            );

        });

        updateParticipants();

        /*
           Depois que recebemos a lista,
           iniciamos as conexões necessárias.
        */

        setTimeout(() => {

            for (const [id] of participants) {

                if (id === myPeerId)
                    continue;

                /*
                   Não criamos conexão de dados
                   com o host novamente.
                */

                if (id === hostPeerId)
                    continue;

            }

        }, 200);

        return;
    }


    if (data.type === "user-joined") {

        participants.set(
            data.id,
            data.name
        );

        updateParticipants();

        addMessage(
            "Sistema",
            data.name + " entrou na sala."
        );

        return;
    }


    if (data.type === "user-left") {

        participants.delete(data.id);

        updateParticipants();

        removeVideo(data.id);

        return;
    }


    if (data.type === "chat") {

        addMessage(
            data.name,
            data.text
        );

        return;
    }

}


/* =========================================================
   BROADCAST
========================================================= */

function broadcast(data) {

    for (const conn of dataConnections.values()) {

        if (conn.open) {

            try {
                conn.send(data);
            } catch (_) {}

        }
    }
}


function broadcastExcept(exceptId, data) {

    for (const [id, conn] of dataConnections) {

        if (
            id !== exceptId &&
            conn.open
        ) {

            try {
                conn.send(data);
            } catch (_) {}

        }
    }
}


/* =========================================================
   PARTICIPANTES
========================================================= */

function updateParticipants() {

    participantsEl.innerHTML = "";

    for (const [id, name] of participants) {

        const div = document.createElement("div");

        div.className = "participant";

        div.textContent =
            (id === myPeerId ? "🟢 " : "⚪ ") +
            name;

        participantsEl.appendChild(div);

    }
}


/* =========================================================
   CHAT
========================================================= */

sendBtn.onclick = sendMessage;

messageInput.addEventListener("keydown", e => {

    if (e.key === "Enter")
        sendMessage();

});


function sendMessage() {

    const text =
        messageInput.value.trim();

    if (!text)
        return;

    messageInput.value = "";

    /*
       Host manda para todos.
    */

    if (isHost) {

        broadcast({
            type: "chat",
            name: myName,
            text: text
        });

        addMessage(
            myName,
            text
        );

    } else if (
        hostConnection &&
        hostConnection.open
    ) {

        hostConnection.send({
            type: "chat",
            name: myName,
            text: text
        });

    }

}


/* =========================================================
   STREAM ATUAL
========================================================= */

/*
   IMPORTANTE:

   Nunca usamos screenStream diretamente como
   "stream definitivo".

   A função abaixo monta a stream que será enviada.
*/

function getOutgoingStream() {

    const tracks = [];

    /*
       MICROFONE
    */

    if (micEnabled && micStream) {

        const audioTracks =
            micStream.getAudioTracks();

        if (audioTracks.length) {

            tracks.push(
                audioTracks[0]
            );

        }
    }

    /*
       TELA

       Se estiver transmitindo,
       o vídeo da tela tem prioridade.
    */

    if (
        screenEnabled &&
        screenStream
    ) {

        const videoTracks =
            screenStream.getVideoTracks();

        if (videoTracks.length) {

            tracks.push(
                videoTracks[0]
            );

        }

        /*
           Se a captura da tela tiver áudio
           e o microfone estiver desligado,
           podemos transmitir o áudio da tela.
        */

        if (
            !micEnabled &&
            screenStream.getAudioTracks().length
        ) {

            tracks.push(
                screenStream.getAudioTracks()[0]
            );

        }

    }

    /*
       CÂMERA

       Só é usada quando não existe
       transmissão de tela.
    */

    else if (
        cameraEnabled &&
        cameraStream
    ) {

        const videoTracks =
            cameraStream.getVideoTracks();

        if (videoTracks.length) {

            tracks.push(
                videoTracks[0]
            );

        }

    }

    if (!tracks.length)
        return null;

    return new MediaStream(tracks);
}


/* =========================================================
   ATUALIZAÇÃO DAS CHAMADAS
========================================================= */

function syncAllCalls() {

    const stream =
        getOutgoingStream();

    for (const call of mediaCalls.values()) {

        syncCallTracks(
            call,
            stream
        );

    }

}


/*
   Substitui os tracks da conexão sem
   destruir a chamada.

   Isso é FUNDAMENTAL para a tela não parar.
*/

function syncCallTracks(call, stream) {

    if (
        !call ||
        !call.peerConnection
    )
        return;

    const pc =
        call.peerConnection;

    const senders =
        pc.getSenders();

    const audioTrack =
        stream?.getAudioTracks()[0] || null;

    const videoTrack =
        stream?.getVideoTracks()[0] || null;

    let audioDone = false;
    let videoDone = false;

    for (const sender of senders) {

        const kind =
            sender.track?.kind;

        if (kind === "audio") {

            sender.replaceTrack(
                audioTrack
            ).catch(() => {});

            audioDone = true;
        }

        if (kind === "video") {

            sender.replaceTrack(
                videoTrack
            ).catch(() => {});

            videoDone = true;
        }
    }

    /*
       Se a chamada ainda não possuía um
       sender adequado, não destruímos a chamada.
    */

}


/* =========================================================
   CRIAR CHAMADAS DE MÍDIA
========================================================= */

function callParticipant(peerId) {

    if (!peer)
        return;

    if (peerId === myPeerId)
        return;

    const stream =
        getOutgoingStream();

    if (!stream)
        return;

    /*
       Já existe chamada.
    */

    if (mediaCalls.has(peerId)) {

        syncCallTracks(
            mediaCalls.get(peerId),
            stream
        );

        return;
    }

    const call =
        peer.call(
            peerId,
            stream,
            {
                metadata: {
                    name: myName
                }
            }
        );

    if (!call)
        return;

    mediaCalls.set(
        peerId,
        call
    );

    setupCall(call);

}


/* =========================================================
   CHAMADA RECEBIDA
========================================================= */

function handleIncomingCall(call) {

    const callerId =
        call.peer;

    /*
       Respondemos com a stream atual.

       Se não temos câmera/microfone,
       ainda respondemos à chamada.
    */

    const stream =
        getOutgoingStream();

    try {

        if (stream) {

            call.answer(stream);

        } else {

            call.answer();

        }

    } catch (error) {

        console.error(
            "Erro ao responder chamada:",
            error
        );

        return;
    }

    mediaCalls.set(
        callerId,
        call
    );

    setupCall(call);

}


/* =========================================================
   CONFIGURAÇÃO DA CHAMADA
========================================================= */

function setupCall(call) {

    call.on("stream", remoteStream => {

        showRemoteStream(
            call.peer,
            remoteStream
        );

    });

    call.on("close", () => {

        if (
            mediaCalls.get(call.peer) === call
        ) {

            mediaCalls.delete(
                call.peer
            );

        }

    });

    call.on("error", error => {

        console.error(
            "Erro na chamada:",
            error
        );

    });

}


/* =========================================================
   VÍDEO REMOTO
========================================================= */

function showRemoteStream(
    peerId,
    stream
) {

    let box =
        document.getElementById(
            "video-" + peerId
        );

    if (!box) {

        box = document.createElement("div");

        box.className =
            "video-box";

        box.id =
            "video-" + peerId;

        const video =
            document.createElement("video");

        video.autoplay = true;
        video.playsInline = true;

        video.id =
            "stream-" + peerId;

        box.appendChild(video);

        const label =
            document.createElement("div");

        label.className =
            "video-name";

        label.id =
            "label-" + peerId;

        label.textContent =
            participants.get(peerId) ||
            "Usuário";

        box.appendChild(label);

        videosEl.appendChild(box);

    }

    const video =
        document.getElementById(
            "stream-" + peerId
        );

    if (video.srcObject !== stream) {

        video.srcObject =
            stream;

    }

    video.play().catch(() => {});

    updateScreenBadge(
        peerId,
        stream
    );
}


/*
   Mostra "TELA" quando a stream
   contém vídeo de compartilhamento.
*/

function updateScreenBadge(
    peerId,
    stream
) {

    const box =
        document.getElementById(
            "video-" + peerId
        );

    if (!box)
        return;

    let badge =
        box.querySelector(".screen-badge");

    /*
       Se a stream tem vídeo, marcamos
       como transmissão.
    */

    if (stream.getVideoTracks().length) {

        if (!badge) {

            badge =
                document.createElement("div");

            badge.className =
                "screen-badge";

            badge.textContent =
                "🖥️ TRANSMITINDO";

            box.appendChild(badge);
        }

    }

}


function removeVideo(peerId) {

    const box =
        document.getElementById(
            "video-" + peerId
        );

    if (box)
        box.remove();

}


function updateAllLabels() {

    for (const [id, name] of participants) {

        const label =
            document.getElementById(
                "label-" + id
            );

        if (label)
            label.textContent = name;

    }
}


/* =========================================================
   MICROFONE
========================================================= */

micBtn.onclick = async () => {

    try {

        if (!micStream) {

            micStream =
                await navigator.mediaDevices
                    .getUserMedia({
                        audio: true
                    });

        }

        micEnabled =
            !micEnabled;

        micStream
            .getAudioTracks()
            .forEach(track => {

                track.enabled =
                    micEnabled;

            });

        micBtn.classList.toggle(
            "active",
            micEnabled
        );

        syncAllCalls();

        if (micEnabled)
            startCallsToEveryone();

    } catch (error) {

        console.error(error);

        alert(
            "Não foi possível acessar o microfone."
        );
    }

};

cameraBtn.onclick = async () => {

};


/* =========================================================
   TRANSMISSÃO DE TELA
========================================================= */

screenBtn.onclick =
    startScreenShare;


async function startScreenShare() {

    /*
       Evita criar duas capturas ao mesmo tempo.
    */

    if (screenEnabled)
        return;

    try {

        /*
           ESTE É O PONTO MAIS IMPORTANTE.

           getDisplayMedia abre o seletor nativo
           do Chrome.

           O usuário pode escolher:

           - Tela inteira
           - Janela
           - Aba do Chrome
        */

        const stream =
            await navigator.mediaDevices
                .getDisplayMedia({

                    video: {
                        cursor: "always"
                    },

                    audio: true

                });


        /*
           A captura só é considerada ativa
           DEPOIS que o Chrome entregar a stream.
        */

        screenStream =
            stream;

        screenEnabled =
            true;


        screenBtn.style.display =
            "none";

        stopScreenBtn.style.display =
            "block";


        addMessage(
            "Sistema",
            myName +
            " começou a transmitir a tela."
        );


        /*
           Quando o usuário clica em
           "Parar compartilhamento" no
           próprio Chrome, o track termina.

           Aqui detectamos isso.
        */

        const videoTrack =
            screenStream.getVideoTracks()[0];

        if (videoTrack) {

            videoTrack.onended = () => {

                stopScreenShare();

            };

        }


        /*
           Primeiro tenta atualizar chamadas
           existentes.
        */

        syncAllCalls();


        /*
           Se ainda não existe chamada,
           cria uma para cada participante.
        */

        startCallsToEveryone();


    } catch (error) {

        console.error(
            "Erro ao iniciar transmissão:",
            error
        );

        /*
           Cancelar o seletor do Chrome
           NÃO deve ser tratado como uma
           transmissão iniciada.
        */

        screenStream = null;
        screenEnabled = false;

        screenBtn.style.display =
            "block";

        stopScreenBtn.style.display =
            "none";

    }

}


/* =========================================================
   PARAR TRANSMISSÃO
========================================================= */

stopScreenBtn.onclick =
    stopScreenShare;


function stopScreenShare() {

    if (!screenStream)
        return;


    /*
       Desliga todos os tracks da captura.
    */

    screenStream
        .getTracks()
        .forEach(track => {

            track.onended = null;

            if (
                track.readyState !== "ended"
            ) {

                track.stop();

            }

        });


    screenStream = null;

    screenEnabled = false;


    screenBtn.style.display =
        "block";

    stopScreenBtn.style.display =
        "none";


    /*
       IMPORTANTE:

       Não fechamos as chamadas WebRTC.

       Apenas substituímos o vídeo da tela
       pela câmera, ou removemos o vídeo.

       Assim a chamada continua viva.
    */

    syncAllCalls();


    addMessage(
        "Sistema",
        myName +
        " parou a transmissão."
    );

}


/* =========================================================
   CHAMADAS PARA TODOS
========================================================= */

function startCallsToEveryone() {

    for (const [id] of participants) {

        if (id === myPeerId)
            continue;

        /*
           Se sou cliente, o host também pode
           ser chamado para que ele receba nossa mídia.
        */

        callParticipant(id);

    }

}


/* =========================================================
   LIMPEZA
========================================================= */

window.addEventListener(
    "beforeunload",
    () => {

        try {

            if (screenStream) {

                screenStream
                    .getTracks()
                    .forEach(track =>
                        track.stop()
                    );

            }

            if (micStream) {

                micStream
                    .getTracks()
                    .forEach(track =>

                    );

            }

            if (cameraStream) {

                cameraStream
                    .getTracks()
                    .forEach(track =>

                    );

            }

            for (

            ) {

                try {
                    call.close();
                } catch (_) {}

            }

            if (peer) {

                try {
                    peer.destroy();
                } catch (_) {}

            }

        } catch (_) {}

    }
);


/* =========================================================
   SEGURANÇA CONTRA PÁGINA SENDO FECHADA
========================================================= */

window.addEventListener(
    "unhandledrejection",
    event => {

        console.error(
            "Promise:",
            event.reason
        );

        /*
           Impede que um erro de uma Promise
           derrube a lógica da aplicação.
        */

        event.preventDefault();

    }
);
