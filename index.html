<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>DZcord</title>
<style>
:root{
  --bg-void:#0A0C11;
  --bg-rail:#0F1117;
  --bg-panel:#151824;
  --bg-elevated:#1C2030;
  --bg-hover:#252A3C;
  --line:#242838;
  --text-hi:#EDEEF4;
  --text-mid:#9AA0BE;
  --text-low:#5B6284;
  --brand:#7C6CFF;
  --brand-dim:#5b4fd6;
  --live:#FF5C7A;
  --signal:#2FE0C4;
  --online:#3ECF8E;
  --idle:#F5B942;
  --dnd:#F5484B;
  --offline:#4B5163;
  --r-sm:6px;
  --r-md:10px;
  --r-lg:16px;
  --r-xl:22px;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:var(--bg-void);color:var(--text-hi);overflow:hidden;-webkit-tap-highlight-color:transparent;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:#2A2F42;border-radius:8px;}
::-webkit-scrollbar-track{background:transparent;}

/* ---------- LOGIN ---------- */
#loginOverlay{
  position:fixed;inset:0;background:radial-gradient(circle at 30% 20%, #1a1030 0%, #0A0C11 60%);
  display:flex;align-items:center;justify-content:center;z-index:500;
}
.login-card{width:360px;max-width:90vw;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:36px 30px;text-align:center;}
.login-mark{font-size:15px;letter-spacing:.4px;color:var(--text-low);margin-bottom:6px;}
.login-title{font-size:30px;font-weight:750;letter-spacing:-0.7px;margin:0 0 4px;
  background:linear-gradient(120deg,#9C8CFF,#2FE0C4);-webkit-background-clip:text;background-clip:text;color:transparent;}
.login-sub{color:var(--text-mid);font-size:13.5px;margin:0 0 22px;line-height:1.5;}
.login-card input{width:100%;background:var(--bg-elevated);border:1px solid var(--line);color:var(--text-hi);
  border-radius:var(--r-md);padding:12px 14px;font-size:14.5px;outline:none;margin-bottom:14px;}
.login-card input:focus{border-color:var(--brand);}
.login-card button.primary{width:100%;padding:12px;border:none;border-radius:var(--r-md);background:var(--brand);
  color:#fff;font-weight:650;font-size:14.5px;}
.login-card button.primary:active{background:var(--brand-dim);}
.login-note{margin-top:16px;font-size:11.5px;color:var(--text-low);line-height:1.5;}

/* ---------- APP SHELL ---------- */
#app{display:none;height:100%;grid-template-columns:72px 232px 1fr 220px;grid-template-rows:1fr;}
#app.on{display:grid;}
@media (max-width:900px){
  #app{grid-template-columns:64px 0 1fr 0;}
}

.rail{background:var(--bg-rail);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:10px;overflow-y:auto;border-right:1px solid var(--line);}
.rail-item{width:46px;height:46px;border-radius:16px;background:var(--bg-elevated);display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:15px;color:var(--text-mid);border:none;transition:border-radius .15s,color .15s;position:relative;flex:none;}
.rail-item:hover{border-radius:13px;color:var(--text-hi);}
.rail-item.active{border-radius:13px;color:#fff;box-shadow:0 0 0 2px var(--brand) inset;}
.rail-item.active::before{content:"";position:absolute;left:-12px;width:4px;height:22px;border-radius:3px;background:var(--brand);}
.rail-sep{width:28px;height:2px;background:var(--line);border-radius:2px;margin:2px 0;flex:none;}
.rail-item.ghost{background:transparent;color:var(--signal);font-size:20px;font-weight:400;border:1.5px dashed var(--line);}
.rail-item.ghost:hover{color:#fff;border-color:var(--signal);}

.sidebar{background:var(--bg-panel);display:flex;flex-direction:column;border-right:1px solid var(--line);min-width:0;}
.sidebar-head{padding:16px 16px 12px;border-bottom:1px solid var(--line);}
.sidebar-head h2{margin:0;font-size:15.5px;font-weight:700;letter-spacing:-0.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sidebar-head .code{font-size:11px;color:var(--text-low);margin-top:2px;cursor:pointer;}
.channels{flex:1;overflow-y:auto;padding:12px 8px;}
.chan-group{margin-bottom:14px;}
.chan-group-label{display:flex;align-items:center;justify-content:space-between;padding:4px 8px;color:var(--text-low);
  font-size:11.5px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;}
.chan-group-label button{background:none;border:none;color:var(--text-low);font-size:15px;line-height:1;padding:2px 4px;border-radius:4px;}
.chan-group-label button:hover{background:var(--bg-hover);color:var(--text-hi);}
.chan-item{display:flex;align-items:center;gap:8px;padding:7px 8px;border-radius:8px;color:var(--text-mid);font-size:14px;
  cursor:pointer;margin-bottom:1px;position:relative;}
.chan-item:hover{background:var(--bg-hover);color:var(--text-hi);}
.chan-item.active{background:var(--bg-elevated);color:#fff;}
.chan-item .icon{opacity:.75;font-size:13px;width:16px;text-align:center;}
.chan-item .del{margin-left:auto;opacity:0;background:none;border:none;color:var(--text-low);font-size:13px;}
.chan-item:hover .del{opacity:1;}
.chan-voice-users{margin:0 0 6px 26px;display:flex;flex-direction:column;gap:2px;}
.chan-voice-users .vu{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--text-mid);padding:2px 0;}
.vu .dot{width:6px;height:6px;border-radius:50%;background:var(--offline);flex:none;}
.vu .mini-tags{display:flex;gap:3px;margin-left:auto;font-size:11px;}

.userbar{border-top:1px solid var(--line);padding:8px 10px;display:flex;align-items:center;gap:8px;background:var(--bg-elevated);}
.avatar{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12.5px;font-weight:700;color:#fff;flex:none;position:relative;}
.avatar .status-dot{position:absolute;bottom:-1px;right:-1px;width:11px;height:11px;border-radius:50%;border:2.5px solid var(--bg-elevated);}
.userbar-info{min-width:0;flex:1;}
.userbar-info .name{font-size:13px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.userbar-info .stat{font-size:11px;color:var(--text-low);}
.userbar-controls{display:flex;gap:2px;}
.ib{width:30px;height:30px;border-radius:8px;background:transparent;border:none;color:var(--text-mid);font-size:14px;display:flex;align-items:center;justify-content:center;}
.ib:hover{background:var(--bg-hover);color:var(--text-hi);}
.ib.off{color:var(--dnd);}

/* ---------- MAIN ---------- */
.main{display:flex;flex-direction:column;min-width:0;background:var(--bg-void);}
.main-header{height:52px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 16px;gap:8px;flex:none;}
.main-header .htitle{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;}
.main-header .htitle .icon{color:var(--text-low);}
.hamburger{display:none;background:none;border:none;color:var(--text-mid);font-size:20px;margin-right:4px;}
@media (max-width:900px){.hamburger{display:block;}}
.header-spacer{flex:1;}
.header-btn{background:var(--bg-elevated);border:1px solid var(--line);color:var(--text-mid);border-radius:8px;padding:6px 10px;font-size:12.5px;display:flex;align-items:center;gap:6px;}
.header-btn:hover{color:var(--text-hi);border-color:var(--brand);}

.chat-scroll{flex:1;overflow-y:auto;padding:14px 18px 6px;}
.msg{display:flex;gap:12px;padding:6px 4px;border-radius:8px;}
.msg:hover{background:#12141d;}
.msg .avatar{margin-top:2px;}
.msg-body{min-width:0;}
.msg-head{display:flex;align-items:baseline;gap:8px;}
.msg-head .u{font-weight:650;font-size:14px;}
.msg-head .t{font-size:11px;color:var(--text-low);}
.msg-text{font-size:14.5px;color:#DEE0EA;line-height:1.45;white-space:pre-wrap;word-break:break-word;}
.sys-msg{text-align:center;color:var(--text-low);font-size:12px;margin:10px 0;}
.empty-chat{margin:auto;text-align:center;color:var(--text-low);padding:40px;}
.empty-chat .big{font-size:34px;margin-bottom:8px;}

.composer{padding:12px 18px 16px;flex:none;}
.composer-inner{background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--r-lg);display:flex;align-items:flex-end;padding:8px 10px;gap:8px;}
.composer textarea{flex:1;background:none;border:none;resize:none;color:var(--text-hi);font-size:14.5px;outline:none;max-height:140px;padding:6px 4px;line-height:1.4;}
.composer textarea::placeholder{color:var(--text-low);}
.emoji-btn{background:none;border:none;font-size:19px;color:var(--text-mid);padding:4px 6px;}
.send-btn{background:var(--brand);border:none;color:#fff;border-radius:8px;padding:8px 14px;font-weight:650;font-size:13px;flex:none;}
.emoji-pop{position:absolute;bottom:64px;right:20px;background:var(--bg-elevated);border:1px solid var(--line);border-radius:var(--r-md);
  padding:8px;display:none;grid-template-columns:repeat(8,1fr);gap:2px;z-index:50;}
.emoji-pop.on{display:grid;}
.emoji-pop button{background:none;border:none;font-size:19px;padding:5px;border-radius:6px;}
.emoji-pop button:hover{background:var(--bg-hover);}

/* ---------- STAGE (voice / screenshare) ---------- */
.stage-wrap{flex:1;display:flex;flex-direction:column;background:#07080c;position:relative;min-height:0;}
.stage-top{flex:1;display:flex;align-items:center;justify-content:center;position:relative;min-height:0;padding:14px;gap:14px;flex-wrap:wrap;overflow:auto;}
.stage-empty{color:var(--text-low);text-align:center;}
.stage-empty .big{font-size:40px;margin-bottom:10px;}
.screen-tile{position:relative;background:#000;border-radius:var(--r-lg);overflow:hidden;max-width:100%;max-height:100%;
  box-shadow:0 0 0 1px var(--line);}
.screen-tile video{display:block;max-width:100%;max-height:70vh;width:auto;height:auto;}
.screen-tile .tag{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);padding:4px 10px;
  border-radius:20px;font-size:12px;font-weight:650;display:flex;align-items:center;gap:6px;}
.screen-tile .tag .live-dot{width:7px;height:7px;border-radius:50%;background:var(--live);animation:pulse 1.4s infinite;}
@keyframes pulse{0%{opacity:1;}50%{opacity:.35;}100%{opacity:1;}}
.stream-picker{display:flex;gap:6px;padding:8px 14px;flex-wrap:wrap;border-top:1px solid var(--line);}
.stream-picker button{background:var(--bg-elevated);border:1px solid var(--line);color:var(--text-mid);border-radius:8px;padding:5px 10px;font-size:12px;}
.stream-picker button.active{border-color:var(--live);color:#fff;}

.cam-row{display:flex;gap:10px;flex-wrap:wrap;padding:10px 14px;flex:none;}
.cam-tile{width:150px;height:100px;background:#000;border-radius:var(--r-md);overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--line);}
.cam-tile video{width:100%;height:100%;object-fit:cover;}
.cam-tile .name{position:absolute;bottom:4px;left:6px;font-size:11px;background:rgba(0,0,0,.5);padding:2px 6px;border-radius:6px;}

.voice-bar{display:flex;align-items:center;justify-content:center;gap:10px;padding:12px;border-top:1px solid var(--line);flex:none;background:var(--bg-panel);}
.voice-bar button{width:44px;height:44px;border-radius:50%;background:var(--bg-elevated);border:1px solid var(--line);color:var(--text-hi);font-size:17px;display:flex;align-items:center;justify-content:center;}
.voice-bar button.off{background:var(--dnd);color:#fff;border-color:var(--dnd);}
.voice-bar button.live{background:var(--live);color:#fff;border-color:var(--live);}
.voice-bar button.leave{background:var(--dnd);color:#fff;}

/* ---------- MEMBERS ---------- */
.members{background:var(--bg-panel);border-left:1px solid var(--line);overflow-y:auto;padding:14px 10px;}
@media (max-width:1100px){.members{display:none;}}
.members h4{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--text-low);margin:6px 8px 8px;}
.member{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;}
.member:hover{background:var(--bg-hover);}
.member .role-badge{font-size:10px;}
.member .name{font-size:13.5px;font-weight:600;}
.member .sub{font-size:11px;color:var(--text-low);}

/* ---------- MODAL ---------- */
.modal-back{position:fixed;inset:0;background:rgba(5,6,10,.65);display:none;align-items:center;justify-content:center;z-index:400;}
.modal-back.on{display:flex;}
.modal{width:400px;max-width:90vw;background:var(--bg-panel);border:1px solid var(--line);border-radius:var(--r-xl);padding:26px;}
.modal h3{margin:0 0 6px;font-size:19px;font-weight:700;}
.modal p.hint{margin:0 0 16px;color:var(--text-mid);font-size:13px;line-height:1.5;}
.modal input,.modal select{width:100%;background:var(--bg-elevated);border:1px solid var(--line);color:var(--text-hi);
  border-radius:var(--r-md);padding:11px 12px;font-size:14px;outline:none;margin-bottom:12px;}
.modal-actions{display:flex;gap:8px;justify-content:flex-end;margin-top:6px;}
.modal-actions button{padding:9px 16px;border-radius:8px;border:none;font-weight:600;font-size:13.5px;}
.modal-actions .cancel{background:transparent;color:var(--text-mid);}
.modal-actions .cancel:hover{color:var(--text-hi);}
.modal-actions .go{background:var(--brand);color:#fff;}
.invite-code{background:var(--bg-elevated);border:1px dashed var(--line);border-radius:var(--r-md);padding:14px;text-align:center;
  font-size:22px;letter-spacing:3px;font-weight:750;color:var(--signal);margin-bottom:14px;user-select:all;}

.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--bg-elevated);border:1px solid var(--line);
  padding:10px 18px;border-radius:10px;font-size:13px;z-index:600;box-shadow:0 8px 24px rgba(0,0,0,.4);opacity:0;transition:opacity .2s;pointer-events:none;}
.toast.on{opacity:1;}

.mobile-scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:90;display:none;}
@media (max-width:900px){
  .sidebar{position:fixed;top:0;left:72px;bottom:0;width:260px;z-index:100;transform:translateX(-340px);transition:transform .2s;}
  .sidebar.open{transform:translateX(0);}
  .mobile-scrim.on{display:block;}
}
.conn-badge{position:fixed;top:10px;right:14px;background:var(--bg-elevated);border:1px solid var(--line);border-radius:20px;
  padding:5px 12px;font-size:11.5px;color:var(--text-mid);z-index:300;display:flex;align-items:center;gap:6px;}
.conn-badge .dot{width:7px;height:7px;border-radius:50%;background:var(--online);}
</style>
</head>
<body>

<!-- LOGIN -->
<div id="loginOverlay">
  <div class="login-card">
    <div class="login-mark">📡 DZCORD</div>
    <h1 class="login-title"></h1>
    <p class="login-sub">Escolha um nome para entrar no DzCord.</p>
    <input id="nameInput" maxlength="20" placeholder="Seu nome" autocomplete="off" />
    <button class="primary" id="loginBtn">Entrar</button>
    <div class="login-note"></div>
  </div>
</div>

<div class="conn-badge" id="connBadge" style="display:none;"><span class="dot"></span><span id="connText">conectando…</span></div>
<div class="mobile-scrim" id="scrim"></div>

<!-- APP -->
<div id="app">
  <div class="rail" id="serverRail"></div>
  <div class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <h2 id="serverName">—</h2>
      <div class="code" id="serverCodeShow" title="Clique para copiar o código de convite">código: —</div>
      <div class="code" id="peerCountShow" style="margin-top:2px;"></div>
    </div>
    <div class="channels" id="channelList"></div>
    <div class="userbar">
      <div class="avatar" id="myAvatar"></div>
      <div class="userbar-info">
        <div class="name" id="myName">—</div>
        <div class="stat" id="myStat">online</div>
      </div>
      <div class="userbar-controls">
        <button class="ib" id="micToggleBar" title="Microfone">🎤</button>
        <button class="ib" id="settingsBtn" title="Status">⚙️</button>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="main-header">
      <button class="hamburger" id="hamburger">☰</button>
      <div class="htitle"><span class="icon" id="headerIcon">#</span><span id="headerTitle">selecione um canal</span></div>
      <div class="header-spacer"></div>
      <button class="header-btn" id="inviteBtn" style="display:none;">🔗 Convidar</button>
    </div>

    <!-- TEXT VIEW -->
    <div id="textView" style="display:flex;flex-direction:column;flex:1;min-height:0;">
      <div class="chat-scroll" id="chatScroll"><div class="empty-chat"><div class="big">💬</div>Crie ou entre em um servidor para começar.</div></div>
      <div class="composer" style="position:relative;">
        <div class="emoji-pop" id="emojiPop"></div>
        <div class="composer-inner">
          <button class="emoji-btn" id="emojiBtn">🙂</button>
          <textarea id="msgInput" rows="1" placeholder="Enviar mensagem…" disabled></textarea>
          <button class="send-btn" id="sendBtn">Enviar</button>
        </div>
      </div>
    </div>

    <!-- VOICE VIEW -->
    <div id="voiceView" style="display:none;flex-direction:column;flex:1;min-height:0;">
      <div class="stage-wrap">
        <div class="stream-picker" id="streamPicker" style="display:none;"></div>
        <div class="stage-top" id="stageTop">
          <div class="stage-empty"><div class="big">🎧</div>Ninguém está transmitindo a tela agora.</div>
        </div>
        <div class="cam-row" id="camRow"></div>
      </div>
      <div class="voice-bar">
        <button id="vMic" title="Microfone">🎤</button>
        <button id="vCam" title="Câmera">📹</button>
        <button id="vScreen" title="Transmitir tela">🖥️</button>
        <button class="leave" id="vLeave" title="Sair">📞</button>
      </div>
    </div>
  </div>

  <div class="members" id="membersPanel"></div>
</div>

<div class="modal-back" id="modalBack">
  <div class="modal" id="modalBody"></div>
</div>
<div class="toast" id="toast"></div>

<script type="module">
import { joinRoom, selfId } from 'https://esm.run/trystero/torrent';

/* ======================= UTILS ======================= */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const uid = ()=> Math.random().toString(36).slice(2,10)+Date.now().toString(36).slice(-4);
const genCode = ()=>{
  const chars='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let s=''; for(let i=0;i<6;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
};
function hashColor(str){
  let h=0; for(let i=0;i<str.length;i++) h = str.charCodeAt(i) + ((h<<5)-h);
  const palette=['#7C6CFF','#2FE0C4','#FF5C7A','#F5B942','#5B8CFF','#E667C0','#4ADE80','#FF9E5E'];
  return palette[Math.abs(h)%palette.length];
}
function initials(name){
  return (name||'?').trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||'').join('')||'?';
}
function fmtTime(ts){
  const d=new Date(ts);
  return d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
}
function store(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch(e){} }
function load(key,fallback){ try{ const v=localStorage.getItem(key); return v?JSON.parse(v):fallback; }catch(e){ return fallback; } }
function toast(msg){
  const t=$('#toast'); t.textContent=msg; t.classList.add('on');
  clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove('on'),2600);
}
function escapeHtml(s){
  return (s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
const EMOJIS = ['😀','😂','😍','😎','🤔','😢','😡','👍','👎','🙏','🎉','🔥','💯','❤️','😭','🤯','👀','✅','❌','🚀','🎮','🖥️','🎤','📹','😴','🤝','👋','🥳'];

/* ======================= PROFILE (per-browser identity) ======================= */
let me = load('dz.profile', null);

/* ======================= LOCAL "MY SERVERS" BOOKMARKS ======================= */
let myServers = load('dz.myservers', []); // [{id,name,icon}]

/* ======================= RUNTIME STATE ======================= */
const S = {
  serverId: null,
  server: null,           // {id,name,channels:[{id,name,type}],roles:{}} - synced via P2P
  channelId: null,        // current selected text/voice channel id
  room: null,             // trystero room
  actions: {},            // {send*, on*}
  roster: {},             // peerId -> {userId,username,color,status}
  presence: {},           // peerId -> {channelId, mic, cam, screen}
  messages: {},           // channelId -> [ {id,userId,username,color,text,time} ]
  streams: {},            // peerId -> {mic:MediaStream, cam:MediaStream, screen:MediaStream}
  local: { mic:null, cam:null, screen:null },
  micOn:false, camOn:false, screenOn:false,
  inVoiceChannel:null,
  viewingPeer:null,       // whose screen is on stage ('me' or peerId)
  isAdmin:true,
};

const RTC_CONFIG = {
  iceServers:[

/* ======================= LOGIN ======================= */
function showApp(){
  $('#loginOverlay').style.display='none';
  $('#app').classList.add('on');
  $('#myName').textContent = me.username;
  $('#myAvatar').style.background = me.color;
  $('#myAvatar').textContent = initials(me.username);
  renderServerRail();
  if(myServers.length){ enterServer(myServers[0].id); }
}
$('#loginBtn').onclick = ()=>{
  const v = $('#nameInput').value.trim();
  if(!v){ $('#nameInput').focus(); return; }
  me = { userId: uid(), username:v.slice(0,20), color:hashColor(v+Date.now()), status:'online' };
  store('dz.profile', me);
  showApp();
};

if(me){ $('#nameInput').value = me.username; showApp(); }

/* ======================= SERVER RAIL ======================= */
function renderServerRail(){
  const rail = $('#serverRail'); rail.innerHTML='';
  myServers.forEach(sv=>{
    const b=document.createElement('button');
    b.className='rail-item'+(sv.id===S.serverId?' active':'');
    b.textContent = initials(sv.name);
    b.title = sv.name;
    b.onclick=()=>enterServer(sv.id);
    rail.appendChild(b);
  });
  if(myServers.length) rail.appendChild(Object.assign(document.createElement('div'),{className:'rail-sep'}));
  const add=document.createElement('button');
  add.className='rail-item ghost'; add.textContent='+'; add.title='Criar servidor';
  add.onclick=openCreateServerModal;
  rail.appendChild(add);
  const join=document.createElement('button');
  join.className='rail-item ghost'; join.textContent='↵'; join.title='Entrar com código';
  join.onclick=openJoinServerModal;
  rail.appendChild(join);
}

window.__dz = {
  closeModal,
  doCreateServer(){
    const name = $('#mSvName').value.trim() || 'Servidor sem nome';
    const id = genCode();
    myServers.push({id,name}); store('dz.myservers',myServers);
    const server = {
      id, name,
      channels: [
        {id:uid(),name:'geral',type:'text'},
        {id:uid(),name:'anúncios',type:'text'},
        {id:uid(),name:'Geral',type:'voice'},
      ]
    };
    store('dz.server.'+id, server);
    closeModal(); renderServerRail(); enterServer(id);
  },
  doJoinServer(){
    const code = $('#mSvCode').value.trim().toUpperCase();
    if(!code) return;
    if(!myServers.find(s=>s.id===code)){
      myServers.push({id:code,name:'Sincronizando…'}); store('dz.myservers',myServers);
    }
    closeModal(); renderServerRail(); enterServer(code);
  },
  copyInvite(){
    navigator.clipboard?.writeText(S.serverId).then(()=>toast('Código copiado: '+S.serverId));
  },
  doCreateChannel(type){
    const name = $('#mChName').value.trim();
    if(!name) return;
    S.server.channels.push({id:uid(), name, type});
    persistAndBroadcastMeta();
    closeModal(); renderChannelList();
  },
  deleteChannel(chId){
    if(!confirm('Excluir este canal para todo mundo?')) return;
    S.server.channels = S.server.channels.filter(c=>c.id!==chId);
    persistAndBroadcastMeta();
    if(S.channelId===chId) S.channelId=null;
    renderChannelList();
  }
};

/* ======================= ENTER / LEAVE SERVER (Trystero room) ======================= */
function enterServer(serverId){
  if(S.room && S.serverId===serverId) return;
  if(S.room) leaveServerRoom();

  S.serverId = serverId;
  S.server = load('dz.server.'+serverId, {id:serverId, name:'Sincronizando…', channels:[]});
  S.channelId = null; S.roster={}; S.presence={}; S.messages={}; S.streams={};
  renderServerRail(); renderChannelList(); renderMembers(); renderHeader();
  $('#serverName').textContent = S.server.name;
  $('#serverCodeShow').textContent = 'código: '+serverId;
  $('#serverCodeShow').onclick = ()=>{ navigator.clipboard?.writeText(serverId); toast('Código copiado'); };
  $('#inviteBtn').style.display='inline-flex';
  $('#inviteBtn').onclick = openInviteModal;

  $('#connBadge').style.display='flex';
  $('#connText').textContent='conectando…';

  const room = joinRoom({appId:'dzcord-app-v1', rtcConfig:RTC_CONFIG}, serverId);
  S.room = room;

  const [sendHello, onHello] = room.makeAction('hello');
  const [sendMeta, onMeta] = room.makeAction('meta');
  const [sendMetaReq, onMetaReq] = room.makeAction('mreq');
  const [sendChat, onChat] = room.makeAction('chat');
  const [sendPresence, onPresence] = room.makeAction('pres');
  const [sendHist, onHist] = room.makeAction('hist');
  const [sendHistReq, onHistReq] = room.makeAction('hreq');
  S.actions = {sendHello,sendMeta,sendMetaReq,sendChat,sendPresence,sendHist,sendHistReq};

  onHello((data,peerId)=>{
    S.roster[peerId] = data;
    renderMembers(); renderChannelList();
  });
  onMeta((data)=>{
    S.server = data;
    store('dz.server.'+serverId, data);
    const bm = myServers.find(s=>s.id===serverId);
    if(bm){ bm.name=data.name; store('dz.myservers',myServers); }
    $('#serverName').textContent = data.name;
    renderServerRail(); renderChannelList(); renderHeader();
    $('#connText').textContent='conectado';
  });
  onMetaReq((_,peerId)=>{
    if(S.server && S.server.channels?.length) sendMeta(S.server, [peerId]);
  });
  onChat((msg)=>{
    if(!S.messages[msg.channelId]) S.messages[msg.channelId]=[];
    S.messages[msg.channelId].push(msg);
    if(S.messages[msg.channelId].length>500) S.messages[msg.channelId].shift();
    if(msg.channelId===S.channelId) renderChat();
  });
  onHistReq((chanId,peerId)=>{
    const h = S.messages[chanId]||[];
    if(h.length) sendHist({channelId:chanId, msgs:h.slice(-60)}, [peerId]);
  });
  onHist((data)=>{
    const existing = S.messages[data.channelId]||[];
    const ids = new Set(existing.map(m=>m.id));
    const merged = existing.concat(data.msgs.filter(m=>!ids.has(m.id)));
    merged.sort((a,b)=>a.time-b.time);
    S.messages[data.channelId]=merged;
    if(data.channelId===S.channelId) renderChat();
  });
  onPresence((data,peerId)=>{
    S.presence[peerId] = data;
    renderChannelList(); renderMembers(); renderStage(); renderCamRow();
    syncVoiceStreamTargets();
  });

  room.onPeerJoin((peerId)=>{
    sendHello({userId:me.userId, username:me.username, color:me.color, status:me.status});
    if(S.server?.channels?.length) sendMeta(S.server, [peerId]);
    else sendMetaReq(null, [peerId]);
    if(S.inVoiceChannel) sendPresence({channelId:S.inVoiceChannel, mic:S.micOn, cam:S.camOn, screen:S.screenOn}, [peerId]);
    renderMembers();
    const n1 = Object.keys(S.roster).length;
    $('#connText').textContent = 'conectado ('+n1+')';
    $('#peerCountShow').textContent = 'peers conectados: '+n1;
  });
  room.onPeerLeave((peerId)=>{
    delete S.roster[peerId];
    delete S.presence[peerId];
    delete S.streams[peerId];
    renderMembers(); renderChannelList(); renderStage(); renderCamRow();
    const n2 = Object.keys(S.roster).length;
    $('#connText').textContent = 'conectado ('+n2+')';
    $('#peerCountShow').textContent = 'peers conectados: '+n2;
  });

  room.onPeerStream((stream, peerId, meta)=>{
    if(!S.streams[peerId]) S.streams[peerId]={};
    S.streams[peerId][meta?.kind || 'mic'] = stream;
    if(meta?.kind==='mic'){
      playRemoteAudio(peerId, stream);
    }
    renderStage(); renderCamRow(); renderStreamPicker();
  });

  sendHello({userId:me.userId, username:me.username, color:me.color, status:me.status});
  sendMetaReq(null);

  // Retry the sync a few times in case the first messages went out before
  // the P2P data channel was fully ready, or peers connect a bit later.
  let tries = 0;
  const retryTimer = setInterval(()=>{
    tries++;
    if(S.serverId!==serverId || S.server?.channels?.length){ clearInterval(retryTimer); return; }
    sendHello({userId:me.userId, username:me.username, color:me.color, status:me.status});
    S.actions.sendMetaReq?.(null);
    const n = Object.keys(S.roster).length;
    $('#connText').textContent = n>0 ? ('conectado ('+n+')') : 'procurando peer…';
    $('#peerCountShow').textContent = 'peers conectados: '+n;
    if(tries>=20) clearInterval(retryTimer); // ~50s of retries
  }, 2500);

  renderChat();
}
window.__dz.retrySync = function(){
  if(!S.room) return;
  S.actions.sendHello?.({userId:me.userId, username:me.username, color:me.color, status:me.status});
  S.actions.sendMetaReq?.(null);
  const n = Object.keys(S.roster).length;
  toast(n>0 ? ('Pedindo dados a '+n+' pessoa(s)…') : 'Nenhum peer conectado ainda. Confirme o código com quem criou o servidor.');
};

function leaveServerRoom(){
  leaveVoice();
  try{ S.room.leave(); }catch(e){}
  S.room=null; S.actions={};
}

function persistAndBroadcastMeta(){
  store('dz.server.'+S.serverId, S.server);
  const bm = myServers.find(s=>s.id===S.serverId);
  if(bm){ bm.name=S.server.name; store('dz.myservers',myServers); }
  renderServerRail();
  S.actions.sendMeta?.(S.server);
}

/* ======================= AUDIO PLAYBACK (hidden) ======================= */
const audioEls = {};
function playRemoteAudio(peerId, stream){
  let el = audioEls[peerId];
  if(!el){ el=document.createElement('audio'); el.autoplay=true; el.style.display='none'; document.body.appendChild(el); audioEls[peerId]=el; }
  el.srcObject = stream;
}

/* ======================= CHANNEL LIST ======================= */
function renderChannelList(){
  const c = $('#channelList'); c.innerHTML='';
  if(!S.server?.channels?.length){
    const peerCount = Object.keys(S.roster).length;
    c.innerHTML = `<div style="padding:14px;color:var(--text-low);font-size:13px;line-height:1.6;">
      ${peerCount===0
        ? 'Aguardando conexão com quem criou o servidor…<br>Confirme que a outra pessoa já abriu o DZcord e entrou com o mesmo código.'
        : 'Conectado a '+peerCount+' pessoa(s), sincronizando canais…'}
      <br><button class="header-btn" style="margin-top:10px;" onclick="window.__dz.retrySync()">🔄 Tentar sincronizar de novo</button>
    </div>`;
  } else {
    const groups = {text:[],voice:[]};
    S.server.channels.forEach(ch=>groups[ch.type]?.push(ch));

    const textGroup = document.createElement('div'); textGroup.className='chan-group';
    textGroup.innerHTML = `<div class="chan-group-label"><span>Texto</span><button title="Novo canal de texto" onclick="window.__dz2.newChan('text')">+</button></div>`;
    groups.text.forEach(ch=>{
      const el=document.createElement('div');
      el.className='chan-item'+(S.channelId===ch.id?' active':'');
      el.innerHTML = `<span class="icon">#</span><span>${escapeHtml(ch.name)}</span><button class="del" onclick="window.__dz2.delChan(event,'${ch.id}')">✕</button>`;
      el.onclick = ()=>selectChannel(ch.id,'text');
      textGroup.appendChild(el);
    });
    c.appendChild(textGroup);

    const voiceGroup = document.createElement('div'); voiceGroup.className='chan-group';
    voiceGroup.innerHTML = `<div class="chan-group-label"><span>Voz</span><button title="Novo canal de voz" onclick="window.__dz2.newChan('voice')">+</button></div>`;
    groups.voice.forEach(ch=>{
      const el=document.createElement('div');
      el.className='chan-item'+(S.channelId===ch.id && S.inVoiceChannel===ch.id?' active':'');
      el.innerHTML = `<span class="icon">🔊</span><span>${escapeHtml(ch.name)}</span><button class="del" onclick="window.__dz2.delChan(event,'${ch.id}')">✕</button>`;
      el.onclick = ()=>selectChannel(ch.id,'voice');
      voiceGroup.appendChild(el);

      const usersHere = peersInChannel(ch.id);
      if(usersHere.length){
        const uw = document.createElement('div'); uw.className='chan-voice-users';
        usersHere.forEach(u=>{
          const row=document.createElement('div'); row.className='vu';
          row.innerHTML = `<span class="dot" style="background:${u.color}"></span><span>${escapeHtml(u.username)}</span>
            <span class="mini-tags">${u.mic?'🎤':'🔇'}${u.screen?' 🖥️':''}${u.cam?' 📹':''}</span>`;
          uw.appendChild(row);
        });
        voiceGroup.appendChild(uw);
      }
    });
    c.appendChild(voiceGroup);
  }
}
window.__dz2 = {
  newChan:(type)=>openCreateChannelModal(type),
  delChan:(e,id)=>{ e.stopPropagation(); window.__dz.deleteChannel(id); }
};

function peersInChannel(channelId){
  const list=[];
  if(S.inVoiceChannel===channelId) list.push({username:me.username,color:me.color,mic:S.micOn,cam:S.camOn,screen:S.screenOn});
  Object.entries(S.presence).forEach(([peerId,p])=>{
    if(p.channelId===channelId){
      const prof = S.roster[peerId]||{username:'Membro',color:'#666'};
      list.push({username:prof.username,color:prof.color,mic:p.mic,cam:p.cam,screen:p.screen});
    }
  });
  return list;
}

/* ======================= SELECT CHANNEL ======================= */
function selectChannel(chId, type){
  S.channelId = chId;
  renderChannelList(); renderHeader();
  if(type==='text'){
    $('#textView').style.display='flex';
    $('#voiceView').style.display='none';
    $('#msgInput').disabled=false;
    S.actions.sendHistReq?.(chId);
    renderChat();
  } else {
    $('#textView').style.display='none';
    $('#voiceView').style.display='flex';
    joinVoice(chId);
  }
  closeMobileSidebar();
}
function renderHeader(){
  const ch = S.server?.channels?.find(c=>c.id===S.channelId);
  $('#headerIcon').textContent = ch? (ch.type==='voice'?'🔊':'#') : '#';
  $('#headerTitle').textContent = ch? ch.name : 'selecione um canal';
}

/* ======================= CHAT ======================= */
$('#msgInput').addEventListener('input', e=>{ e.target.style.height='auto'; e.target.style.height=Math.min(e.target.scrollHeight,140)+'px'; });
$('#msgInput').addEventListener('keydown', e=>{
  if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendMessage(); }
});
$('#sendBtn').onclick = sendMessage;
function sendMessage(){
  const input = $('#msgInput');
  const text = input.value.trim();
  if(!text || !S.channelId) return;
  const msg = {id:uid(), channelId:S.channelId, userId:me.userId, username:me.username, color:me.color, text, time:Date.now()};
  if(!S.messages[msg.channelId]) S.messages[msg.channelId]=[];
  S.messages[msg.channelId].push(msg);
  S.actions.sendChat?.(msg);
  input.value=''; input.style.height='auto';
  renderChat();
}
function renderChat(){
  const box = $('#chatScroll');
  const list = S.messages[S.channelId]||[];
  if(!S.channelId){
    box.innerHTML = '<div class="empty-chat"><div class="big">💬</div>Selecione um canal de texto.</div>'; return;
  }
  if(!list.length){
    box.innerHTML = '<div class="empty-chat"><div class="big">👋</div>Nenhuma mensagem ainda. Diga oi!</div>'; return;
  }
  box.innerHTML = list.map(m=>`
    <div class="msg">
      <div class="avatar" style="background:${m.color};width:36px;height:36px;">${initials(m.username)}</div>
      <div class="msg-body">
        <div class="msg-head"><span class="u">${escapeHtml(m.username)}</span><span class="t">${fmtTime(m.time)}</span></div>
        <div class="msg-text">${escapeHtml(m.text)}</div>
      </div>
    </div>
  `).join('');
  box.scrollTop = box.scrollHeight;
}

/* ======================= VOICE / MEDIA ======================= */
async function joinVoice(chId){
  if(S.inVoiceChannel===chId){ renderStage(); renderCamRow(); return; }
  if(S.inVoiceChannel) await stopAllMediaAndLeaveVoiceOnly();

  S.inVoiceChannel = chId;
  try{
    S.local.mic = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true}});
    S.micOn = true;
  }catch(e){
    toast('Não foi possível acessar o microfone.'); S.micOn=false;
  }
  updateVoiceBarUI();
  S.actions.sendPresence?.({channelId:chId, mic:S.micOn, cam:S.camOn, screen:S.screenOn});
  syncVoiceStreamTargets();
  renderChannelList(); renderStage(); renderCamRow();
}

function currentVoicePeers(){
  return Object.entries(S.presence).filter(([_,p])=>p.channelId===S.inVoiceChannel).map(([peerId])=>peerId);
}

let sentTargets = { mic:new Set(), cam:new Set(), screen:new Set() };
function syncVoiceStreamTargets(){
  if(!S.room) return;
  const wanted = S.inVoiceChannel ? new Set(currentVoicePeers()) : new Set();
  ['mic','cam','screen'].forEach(kind=>{
    const stream = S.local[kind];
    if(!stream) { sentTargets[kind]=new Set(); return; }
    const prev = sentTargets[kind];
    wanted.forEach(pid=>{
      if(!prev.has(pid)){
        try{ S.room.addStream(stream, [pid], {kind}); }catch(e){}
      }
    });
    prev.forEach(pid=>{
      if(!wanted.has(pid)){
        try{ S.room.removeStream(stream, [pid]); }catch(e){}
      }
    });
    sentTargets[kind] = wanted;
  });
}

function updateVoiceBarUI(){
  $('#vMic').classList.toggle('off', !S.micOn);
  $('#vCam').classList.toggle('live', S.camOn);
  $('#vScreen').classList.toggle('live', S.screenOn);
  $('#micToggleBar').classList.toggle('off', !S.micOn);
}

$('#vMic').onclick = ()=>{
  if(!S.local.mic) return;
  S.micOn = !S.micOn;
  S.local.mic.getAudioTracks().forEach(t=>t.enabled=S.micOn);
  updateVoiceBarUI();
  S.actions.sendPresence?.({channelId:S.inVoiceChannel, mic:S.micOn, cam:S.camOn, screen:S.screenOn});
  renderChannelList();
};
$('#micToggleBar').onclick = ()=> $('#vMic').onclick();

$('#vCam').onclick = async ()=>{
  if(!S.inVoiceChannel){ toast('Entre em um canal de voz primeiro.'); return; }
  if(!S.camOn){
    try{
      S.local.cam = await navigator.mediaDevices.getUserMedia({video:{width:320,height:240}});
      S.camOn = true;
      renderCamRow();
    }catch(e){ toast('Não foi possível acessar a câmera.'); return; }
  } else {
    S.local.cam?.getTracks().forEach(t=>t.stop());
    S.local.cam = null; S.camOn = false;
    renderCamRow();
  }
  updateVoiceBarUI();
  syncVoiceStreamTargets();
  S.actions.sendPresence?.({channelId:S.inVoiceChannel, mic:S.micOn, cam:S.camOn, screen:S.screenOn});
  renderChannelList();
};

$('#vScreen').onclick = async ()=>{
  if(!S.inVoiceChannel){ toast('Entre em um canal de voz primeiro.'); return; }
  if(!S.screenOn){
    try{
      S.local.screen = await navigator.mediaDevices.getDisplayMedia({video:{cursor:'always'},audio:false});
      S.screenOn = true;
      S.local.screen.getVideoTracks()[0].addEventListener('ended', stopScreenShare);
      S.viewingPeer='me';
    }catch(e){ toast('Compartilhamento de tela cancelado.'); return; }
  } else {
    stopScreenShare();
  }
  updateVoiceBarUI();
  syncVoiceStreamTargets();
  S.actions.sendPresence?.({channelId:S.inVoiceChannel, mic:S.micOn, cam:S.camOn, screen:S.screenOn});
  renderChannelList(); renderStage(); renderStreamPicker();
};
function stopScreenShare(){
  S.local.screen?.getTracks().forEach(t=>t.stop());
  S.local.screen=null; S.screenOn=false;
  if(S.viewingPeer==='me') S.viewingPeer=null;
  updateVoiceBarUI();
  syncVoiceStreamTargets();
  S.actions.sendPresence?.({channelId:S.inVoiceChannel, mic:S.micOn, cam:S.camOn, screen:S.screenOn});
  renderChannelList(); renderStage(); renderStreamPicker();
}

$('#vLeave').onclick = ()=> leaveVoice();
async function leaveVoice(){
  if(!S.inVoiceChannel) return;
  await stopAllMediaAndLeaveVoiceOnly();
  S.channelId = null;
  renderChannelList(); renderHeader();
  $('#voiceView').style.display='none';
  $('#textView').style.display='flex';
}
async function stopAllMediaAndLeaveVoiceOnly(){
  const chId = S.inVoiceChannel;
  ['mic','cam','screen'].forEach(kind=>{
    if(S.local[kind]){
      S.local[kind].getTracks().forEach(t=>t.stop());
      S.local[kind]=null;
    }
  });
  S.micOn=S.camOn=S.screenOn=false; S.viewingPeer=null;
  syncVoiceStreamTargets();
  S.actions.sendPresence?.({channelId:null, mic:false, cam:false, screen:false});
  S.inVoiceChannel=null;
  renderStage(); renderCamRow();
}
window.addEventListener('beforeunload', ()=>{ try{ stopAllMediaAndLeaveVoiceOnly(); }catch(e){} });

/* ======================= STAGE RENDERING ======================= */
function activeBroadcasters(){
  const arr=[];
  if(S.screenOn) arr.push({peerId:'me', username:me.username, stream:S.local.screen});
  Object.entries(S.streams).forEach(([peerId,kinds])=>{
    if(kinds.screen && S.presence[peerId]?.channelId===S.inVoiceChannel){
      const prof=S.roster[peerId]||{username:'Membro'};
      arr.push({peerId, username:prof.username, stream:kinds.screen});
    }
  });
  return arr;
}
function renderStreamPicker(){
  const wrap = $('#streamPicker');
  const list = activeBroadcasters();
  if(list.length<2){ wrap.style.display='none'; wrap.innerHTML=''; return; }
  wrap.style.display='flex';
  wrap.innerHTML = list.map(b=>`<button data-p="${b.peerId}" class="${S.viewingPeer===b.peerId?'active':''}">🖥️ ${escapeHtml(b.username)}</button>`).join('');
  $$('button',wrap).forEach(btn=>btn.onclick=()=>{ S.viewingPeer=btn.dataset.p; renderStage(); renderStreamPicker(); });
}
function renderStage(){
  const top = $('#stageTop');
  const list = activeBroadcasters();
  if(!list.length){
    top.innerHTML = `<div class="stage-empty"><div class="big">🎧</div>Ninguém está transmitindo a tela agora.</div>`;
    renderStreamPicker();
    return;
  }
  if(!S.viewingPeer || !list.find(b=>b.peerId===S.viewingPeer)) S.viewingPeer=list[0].peerId;
  const chosen = list.find(b=>b.peerId===S.viewingPeer);
  top.innerHTML = `<div class="screen-tile"><div class="tag"><span class="live-dot"></span>${escapeHtml(chosen.username)}${chosen.peerId==='me'?' (você)':''}</div><video autoplay playsinline ${chosen.peerId==='me'?'muted':''}></video></div>`;
  $('video',top).srcObject = chosen.stream;
  renderStreamPicker();
}
function renderCamRow(){
  const row = $('#camRow'); row.innerHTML='';
  if(S.camOn && S.local.cam){
    const tile=document.createElement('div'); tile.className='cam-tile';
    tile.innerHTML = `<video autoplay playsinline muted></video><div class="name">${escapeHtml(me.username)} (você)</div>`;
    row.appendChild(tile); $('video',tile).srcObject=S.local.cam;
  }
  Object.entries(S.streams).forEach(([peerId,kinds])=>{
    if(kinds.cam && S.presence[peerId]?.channelId===S.inVoiceChannel){
      const prof=S.roster[peerId]||{username:'Membro'};
      const tile=document.createElement('div'); tile.className='cam-tile';
      tile.innerHTML = `<video autoplay playsinline></video><div class="name">${escapeHtml(prof.username)}</div>`;
      row.appendChild(tile); $('video',tile).srcObject=kinds.cam;
    }
  });
}

/* ======================= MEMBERS PANEL ======================= */
function renderMembers(){
  const p = $('#membersPanel');
  const online = Object.entries(S.roster);
  p.innerHTML = `<h4>Online — ${online.length+1}</h4>`;
  const meRow = document.createElement('div'); meRow.className='member';
  meRow.innerHTML = `<div class="avatar" style="background:${me.color};width:30px;height:30px;font-size:11px;">${initials(me.username)}<span class="status-dot" style="background:var(--online)"></span></div>
    <div><div class="name">${escapeHtml(me.username)} (você)</div><div class="sub">${S.inVoiceChannel?'em canal de voz':'online'}</div></div>`;
  p.appendChild(meRow);
  online.forEach(([peerId,prof])=>{
    const pres = S.presence[peerId];
    const row=document.createElement('div'); row.className='member';
    row.innerHTML = `<div class="avatar" style="background:${prof.color};width:30px;height:30px;font-size:11px;">${initials(prof.username)}<span class="status-dot" style="background:var(--online)"></span></div>
      <div><div class="name">${escapeHtml(prof.username)}</div><div class="sub">${pres?.channelId? 'em canal de voz':'online'}</div></div>`;
    p.appendChild(row);
  });
}

/* ======================= MOBILE NAV ======================= */
$('#hamburger').onclick = ()=>{ $('#sidebar').classList.add('open'); $('#scrim').classList.add('on'); };
$('#scrim').onclick = closeMobileSidebar;
function closeMobileSidebar(){ $('#sidebar').classList.remove('open'); $('#scrim').classList.remove('on'); }

/* ======================= SETTINGS (status) ======================= */
$('#settingsBtn').onclick = ()=>{
  openModal(`
    <h3>Status</h3>
    <select id="mStatus">
      <option value="online" ${me.status==='online'?'selected':''}>🟢 Online</option>
      <option value="idle" ${me.status==='idle'?'selected':''}>🌙 Ausente</option>
      <option value="dnd" ${me.status==='dnd'?'selected':''}>🔴 Não perturbe</option>
    </select>
    <div class="modal-actions">
      <button class="cancel" onclick="window.__dz.closeModal()">Cancelar</button>
      <button class="go" onclick="window.__dz3.saveStatus()">Salvar</button>
    </div>
  `);
};
window.__dz3 = {
  saveStatus(){
    me.status = $('#mStatus').value; store('dz.profile', me);
    $('#myStat').textContent = me.status;
    S.actions.sendHello?.({userId:me.userId, username:me.username, color:me.color, status:me.status});
    closeModal();
  }
};
</script>
