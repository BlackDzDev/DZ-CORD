<script>
/* =====================================================
   DZCORD
===================================================== */

const $ = id => document.getElementById(id);


/* =====================================================
   ESTADO
===================================================== */

let peer = null;

let myPeerId = null;
let myName = "";
let room = "";

let isHost = false;
let hostId = "";

let hostConnection = null;


/*
    Todos os participantes conhecidos.

    ID -> nome
*/
const participants = new Map();


/*
    Conexões de dados.

    ID -> DataConnection
*/
const dataConnections = new Map();


/*
    Chamadas WebRTC.

    ID -> MediaConnection
*/
const mediaCalls = new Map();


/* =====================================================
   STREAMS
===================================================== */

let micStream = null;
let cameraStream = null;
let screenStream = null;

let micEnabled = false;
let cameraEnabled = false;
let screenEnabled = false;


/* =====================================================
   UTILIDADES
===================================================== */

function safeRoom(name) {

    return name
        .trim()
        .toLowerCase()
        .replace(/[^a-z0-9_-]/g, "-");
}


function getHostId(name) {

    return "dzcord-host-" + safeRoom(name);
}


function setStatus(text) {

    $("status").textContent = text;
}


function addSystemMessage(text) {

    const div =
        document.createElement("div");

    div.className =
        "message system";

    div.textContent =
        "⚙️ " + text;

    $("messages").appendChild(div);

    $("messages").scrollTop =
        $("messages").scrollHeight;
}


function addMessage(name, text) {

    const div =
        document.createElement("div");

    div.className =
        "message";


    const nameElement =
        document.createElement("span");

    nameElement.className =
        "message-name";

    nameElement.textContent =
        name + ": ";


    const textElement =
        document.createElement("span");

    textElement.textContent =
        text;


    div.appendChild(nameElement);
    div.appendChild(textElement);

    $("messages").appendChild(div);

    $("messages").scrollTop =
        $("messages").scrollHeight;
}


/* =====================================================
   PARTICIPANTES
===================================================== */

function addParticipant(id, name) {

    if (!id) return;

    participants.set(
        id,
        name || "Usuário"
    );

    updateUserList();
}


function updateUserList() {

    const box =
        $("users");

    box.innerHTML = "";


    for (
        const [id, name]
        of participants
    ) {

        const div =
            document.createElement("div");

        div.className =
            "user" +
            (id === myPeerId
                ? " me"
                : "");


        div.textContent =
            (id === myPeerId
                ? "🟢 "
                : "⚪ ") +
            name;


        box.appendChild(div);
    }
}


/* =====================================================
   VÍDEOS
===================================================== */

function removeVideo(id) {

    const card =
        document.getElementById(
            "video-" + id
        );

    if (card) {
        card.remove();
    }
}


function showLocalStream(stream) {

    if (!stream) {

        removeVideo("local");

        return;
    }


    let card =
        document.getElementById(
            "video-local"
        );


    if (!card) {

        card =
            document.createElement("div");

        card.className =
            "video-card";

        card.id =
            "video-local";


        const video =
            document.createElement("video");

        video.autoplay = true;
        video.muted = true;
        video.playsInline = true;


        const label =
            document.createElement("div");

        label.className =
            "video-name";

        label.textContent =
            myName + " (Você)";


        const badge =
            document.createElement("div");

        badge.className =
            "live-badge";

        badge.textContent =
            "TRANSMITINDO";


        card.appendChild(video);
        card.appendChild(label);
        card.appendChild(badge);

        $("videos").prepend(card);
    }


    const video =
        card.querySelector("video");

    video.srcObject =
        stream;

    video.play().catch(() => {});
}


function showRemoteStream(id, stream) {

    let card =
        document.getElementById(
            "video-" + id
        );


    if (!card) {

        card =
            document.createElement("div");

        card.className =
            "video-card";

        card.id =
            "video-" + id;


        const video =
            document.createElement("video");

        video.autoplay = true;
        video.playsInline = true;
        video.controls = false;


        const label =
            document.createElement("div");

        label.className =
            "video-name";

        label.textContent =
            participants.get(id) ||
            "Usuário";


        const badge =
            document.createElement("div");

        badge.className =
            "live-badge";

        badge.textContent =
            "AO VIVO";


        card.appendChild(video);
        card.appendChild(label);
        card.appendChild(badge);

        $("videos").appendChild(card);
    }


    const video =
        card.querySelector("video");


    if (
        video.srcObject !== stream
    ) {

        video.srcObject =
            stream;

        video.play().catch(() => {});
    }
}


/* =====================================================
   STREAM DE SAÍDA
===================================================== */

function getOutgoingStream() {

    const stream =
        new MediaStream();


    /*
       MICROFONE
    */

    if (
        micEnabled &&
        micStream
    ) {

        for (
            const track
            of micStream.getAudioTracks()
        ) {

            stream.addTrack(track);
        }
    }


    /*
       TELA
       Tela possui prioridade sobre câmera.
    */

    if (
        screenEnabled &&
        screenStream
    ) {

        for (
            const track
            of screenStream.getVideoTracks()
        ) {

            stream.addTrack(track);
        }


        /*
           Áudio da tela,
           caso o navegador forneça.
        */

        if (!micEnabled) {

            for (
                const track
                of screenStream.getAudioTracks()
            ) {

                stream.addTrack(track);
            }
        }

    }

    /*
       CÂMERA
    */

    else if (
        cameraEnabled &&
        cameraStream
    ) {

        for (
            const track
            of cameraStream.getVideoTracks()
        ) {

            stream.addTrack(track);
        }
    }


    return stream.getTracks().length
        ? stream
        : null;
}


/* =====================================================
   CONFIGURAR CHAMADA
===================================================== */

function setupCall(call) {

    const remoteId =
        call.peer;


    call.on(
        "stream",
        remoteStream => {

            console.log(
                "STREAM RECEBIDO:",
                remoteId,
                remoteStream
            );


            showRemoteStream(
                remoteId,
                remoteStream
            );


            setStatus(
                "Recebendo mídia de " +
                (
                    participants.get(remoteId)
                    || "usuário"
                )
            );
        }
    );


    call.on(
        "close",
        () => {

            if (
                mediaCalls.get(remoteId)
                === call
            ) {

                mediaCalls.delete(
                    remoteId
                );
            }

            removeVideo(
                remoteId
            );
        }
    );


    call.on(
        "error",
        error => {

            console.error(
                "Erro na chamada:",
                error
            );


            if (
                mediaCalls.get(remoteId)
                === call
            ) {

                mediaCalls.delete(
                    remoteId
                );
            }
        }
    );
}


/* =====================================================
   CHAMAR PARTICIPANTE
===================================================== */

function callPeer(id) {

    if (!peer) return;

    if (!id) return;

    if (id === myPeerId) return;


    const stream =
        getOutgoingStream();


    if (!stream) return;


    /*
       Já existe chamada.
    */

    if (
        mediaCalls.has(id)
    ) {

        return;
    }


    console.log(
        "FAZENDO CHAMADA:",
        id
    );


    try {

        const call =
            peer.call(
                id,
                stream,
                {
                    metadata: {
                        name: myName
                    }
                }
            );


        if (!call) {

            console.error(
                "PeerJS não criou a chamada."
            );

            return;
        }


        mediaCalls.set(
            id,
            call
        );


        setupCall(call);

    } catch (error) {

        console.error(
            "Erro ao chamar:",
            error
        );
    }
}


/* =====================================================
   RECEBER CHAMADA
===================================================== */

function handleIncomingCall(call) {

    const remoteId =
        call.peer;


    console.log(
        "CHAMADA RECEBIDA DE:",
        remoteId
    );


    /*
       Evita duas chamadas
       simultâneas entre as mesmas pessoas.
    */

    if (
        mediaCalls.has(remoteId)
    ) {

        const existing =
            mediaCalls.get(remoteId);


        /*
           Se nosso ID for menor,
           mantemos a chamada que fizemos.
        */

        if (
            String(myPeerId) <
            String(remoteId)
        ) {

            call.close();

            return;
        }


        /*
           Caso contrário,
           aceitamos a recebida.
        */

        try {
            existing.close();
        } catch {}

        mediaCalls.delete(
            remoteId
        );
    }


    const outgoing =
        getOutgoingStream();


    try {

        /*
           Se temos câmera/mic/tela,
           enviamos também.
        */

        if (outgoing) {

            call.answer(
                outgoing
            );

        } else {

            /*
               Mesmo sem mídia local,
               podemos receber a tela
               do amigo.
            */

            call.answer();
        }


        mediaCalls.set(
            remoteId,
            call
        );


        setupCall(call);

    } catch (error) {

        console.error(
            "Erro respondendo chamada:",
            error
        );
    }
}


/* =====================================================
   RENEGOCIAR
===================================================== */

function renegotiateAll() {

    console.log(
        "Atualizando chamadas..."
    );


    /*
       Fecha chamadas antigas.
    */

    for (
        const call
        of mediaCalls.values()
    ) {

        try {
            call.close();
        } catch {}
    }


    mediaCalls.clear();


    const stream =
        getOutgoingStream();


    /*
       Atualiza prévia local.
    */

    showLocalStream(
        stream
    );


    if (!stream) {

        setStatus(
            "Mídia desligada"
        );

        return;
    }


    /*
       Aguarda um pouco para
       evitar colisões de chamadas.
    */

    let delay = 100;


    for (
        const id
        of participants.keys()
    ) {

        if (
            id === myPeerId
        ) {
            continue;
        }


        setTimeout(
            () => {

                callPeer(id);

            },
            delay
        );


        delay += 150;
    }


    setStatus(
        "Mídia ativada"
    );
}


/* =====================================================
   CONEXÕES DE DADOS
===================================================== */

function handleDataConnection(conn) {

    console.log(
        "CONEXÃO DATA:",
        conn.peer
    );


    dataConnections.set(
        conn.peer,
        conn
    );


    conn.on(
        "open",
        () => {

            console.log(
                "DATA ABERTA:",
                conn.peer
            );


            /*
               Somente host envia
               informações iniciais.
            */

            if (isHost) {

                conn.send({
                    type: "welcome",
                    hostId: hostId,
                    roster:
                        Array.from(
                            participants.entries()
                        )
                });
            }
        }
    );


    conn.on(
        "data",
        data => {

            handleDataMessage(
                conn,
                data
            );
        }
    );


    conn.on(
        "close",
        () => {

            dataConnections.delete(
                conn.peer
            );


            if (isHost) {

                const oldName =
                    participants.get(
                        conn.peer
                    ) ||
                    "Usuário";


                participants.delete(
                    conn.peer
                );


                updateUserList();


                /*
                   Avisa todos.
                */

                broadcast({
                    type: "user-left",
                    id: conn.peer
                });


                removeVideo(
                    conn.peer
                );


                const call =
                    mediaCalls.get(
                        conn.peer
                    );


                if (call) {

                    try {
                        call.close();
                    } catch {}

                    mediaCalls.delete(
                        conn.peer
                    );
                }


                addSystemMessage(
                    oldName +
                    " saiu da sala."
                );
            }
        }
    );


    conn.on(
        "error",
        error => {

            console.error(
                "Erro DATA:",
                error
            );
        }
    );
}


/* =====================================================
   MENSAGENS
===================================================== */

function handleDataMessage(
    conn,
    data
) {

    if (
        !data ||
        !data.type
    ) {

        return;
    }


    /* =================================================
       JOIN
    ================================================= */

    if (
        isHost &&
        data.type === "join"
    ) {

        const id =
            conn.peer;

        const name =
            data.name ||
            "Usuário";


        addParticipant(
            id,
            name
        );


        /*
           Envia lista atualizada
           para o novo usuário.
        */

        conn.send({
            type: "roster",
            roster:
                Array.from(
                    participants.entries()
                )
        });


        /*
           Avisa todos os outros.
        */

        broadcast({
            type: "user-joined",
            id: id,
            name: name
        });


        addSystemMessage(
            name +
            " entrou na sala."
        );


        return;
    }


    /* =================================================
       ROSTER
    ================================================= */

    if (
        data.type === "roster"
    ) {

        participants.clear();


        for (
            const item
            of data.roster || []
        ) {

            addParticipant(
                item[0],
                item[1]
            );
        }


        updateUserList();


        /*
           Se já estamos transmitindo,
           conecta com todos.
        */

        if (
            getOutgoingStream()
        ) {

            setTimeout(
                () => {
                    renegotiateAll();
                },
                300
            );
        }


        return;
    }


    /* =================================================
       USER JOINED
    ================================================= */

    if (
        data.type === "user-joined"
    ) {

        addParticipant(
            data.id,
            data.name
        );


        addSystemMessage(
            data.name +
            " entrou na sala."
        );


        /*
           Se temos mídia,
           chamamos o novo usuário.
        */

        if (
            getOutgoingStream() &&
            data.id !== myPeerId
        ) {

            setTimeout(
                () => {
                    callPeer(
                        data.id
                    );
                },
                500
            );
        }


        return;
    }


    /* =================================================
       USER LEFT
    ================================================= */

    if (
        data.type === "user-left"
    ) {

        const name =
            participants.get(
                data.id
            ) ||
            "Usuário";


        participants.delete(
            data.id
        );


        updateUserList();


        removeVideo(
            data.id
        );


        const call =
            mediaCalls.get(
                data.id
            );


        if (call) {

            try {
                call.close();
            } catch {}

            mediaCalls.delete(
                data.id
            );
        }


        addSystemMessage(
            name +
            " saiu da sala."
        );


        return;
    }


    /* =================================================
       CHAT
    ================================================= */

    if (
        isHost &&
        data.type === "chat"
    ) {

        /*
           Host mostra a própria mensagem.
        */

        addMessage(
            data.name,
            data.text
        );


        /*
           Envia para todos os clientes.
        */

        broadcast(data);


        return;
    }


    if (
        !isHost &&
        data.type === "chat"
    ) {

        addMessage(
            data.name,
            data.text
        );

        return;
    }
}


/* =====================================================
   BROADCAST
===================================================== */

function broadcast(data) {

    for (
        const conn
        of dataConnections.values()
    ) {

        if (
            conn.open
        ) {

            try {
                conn.send(data);
            } catch {}
        }
    }
}


/* =====================================================
   ENVIAR PARA HOST
===================================================== */

function sendToHost(data) {

    if (
        hostConnection &&
        hostConnection.open
    ) {

        try {

            hostConnection.send(
                data
            );

            return true;

        } catch {}
    }


    return false;
}


/* =====================================================
   CRIAR HOST
===================================================== */

function createHost(hostPeer) {

    peer =
        hostPeer;

    isHost =
        true;

    hostId =
        getHostId(room);

    myPeerId =
        hostPeer.id;


    /*
       Registra eventos.
    */

    peer.on(
        "connection",
        handleDataConnection
    );

    peer.on(
        "call",
        handleIncomingCall
    );


    peer.on(
        "error",
        error => {

            console.error(
                "Erro HOST:",
                error
            );

            setStatus(
                "Erro: " +
                (
                    error.type ||
                    error.message
                )
            );
        }
    );


    peer.on(
        "disconnected",
        () => {

            setStatus(
                "Desconectado..."
            );


            try {
                peer.reconnect();
            } catch {}
        }
    );


    /*
       Adiciona o host.
    */

    participants.clear();


    addParticipant(
        myPeerId,
        myName
    );


    /*
       Abre aplicação.
    */

    $("login").style.display =
        "none";

    $("app").style.display =
        "flex";


    $("roomInfo").textContent =
        "Código: " + room;


    setStatus(
        "Sala criada"
    );


    addSystemMessage(
        "Você criou a sala."
    );
}


/* =====================================================
   ENTRAR COMO CLIENTE
===================================================== */

function becomeClient() {

    isHost =
        false;


    hostId =
        getHostId(room);


    console.log(
        "ENTRANDO COMO CLIENTE"
    );


    console.log(
        "HOST:",
        hostId
    );


    /*
       Cliente recebe ID aleatório.
    */

    peer =
        new Peer();


    peer.on(
        "open",
        id => {

            myPeerId =
                id;


            console.log(
                "MEU ID:",
                id
            );


            /*
               Abre aplicação.
            */

            $("login").style.display =
                "none";

            $("app").style.display =
                "flex";


            $("roomInfo").textContent =
                "Código: " + room;


            setStatus(
                "Conectando à sala..."
            );


            /*
               Conecta ao host.
            */

            connectToHost();
        }
    );


    peer.on(
        "call",
        handleIncomingCall
    );


    peer.on(
        "connection",
        handleDataConnection
    );


    peer.on(
        "error",
        error => {

            console.error(
                "Erro CLIENTE:",
                error
            );


            setStatus(
                "Erro: " +
                (
                    error.type ||
                    error.message
                )
            );
        }
    );


    peer.on(
        "disconnected",
        () => {

            setStatus(
                "Desconectado..."
            );


            try {
                peer.reconnect();
            } catch {}
        }
    );
}


/* =====================================================
   CONECTAR AO HOST
===================================================== */

function connectToHost() {

    console.log(
        "CONECTANDO AO HOST:",
        hostId
    );


    hostConnection =
        peer.connect(
            hostId,
            {
                reliable: true
            }
        );


    hostConnection.on(
        "open",
        () => {

            console.log(
                "CONECTADO AO HOST"
            );


            setStatus(
                "Conectado"
            );


            /*
               Envia nosso nome.
            */

            hostConnection.send({
                type: "join",
                name: myName
            });
        }
    );


    hostConnection.on(
        "data",
        data => {

            handleDataMessage(
                hostConnection,
                data
            );
        }
    );


    hostConnection.on(
        "close",
        () => {

            setStatus(
                "Conexão com a sala perdida."
            );
        }
    );


    hostConnection.on(
        "error",
        error => {

            console.error(
                "Erro HOST CONNECTION:",
                error
            );
        }
    );
}


/* =====================================================
   ENTRAR NA SALA
===================================================== */

$("joinBtn").onclick =
    () => {

        myName =
            $("nameInput")
                .value
                .trim();


        room =
            $("roomInput")
                .value
                .trim();


        if (!myName) {

            $("loginStatus")
                .textContent =
                "Digite seu nome.";

            return;
        }


        if (!room) {

            $("loginStatus")
                .textContent =
                "Digite o código da sala.";

            return;
        }


        $("loginStatus")
            .textContent =
            "Entrando na sala...";


        const wantedHost =
            getHostId(room);


        /*
           Tenta ocupar o ID fixo
           do host.

           Se conseguir:
           somos o primeiro.

           Se receber unavailable-id:
           alguém já é o host.
        */

        const hostAttempt =
            new Peer(
                wantedHost
            );


        let decided =
            false;


        hostAttempt.on(
            "open",
            id => {

                if (decided) {
                    return;
                }


                decided = true;


                console.log(
                    "HOST CRIADO:",
                    id
                );


                createHost(
                    hostAttempt
                );
            }
        );


        hostAttempt.on(
            "error",
            error => {

                if (decided) {
                    return;
                }


                console.log(
                    "TENTATIVA HOST:",
                    error.type
                );


                /*
                   A sala já existe.
                */

                if (
                    error.type ===
                    "unavailable-id"
                ) {

                    decided = true;


                    try {
                        hostAttempt.destroy();
                    } catch {}


                    becomeClient();


                    return;
                }


                /*
                   Outro erro.
                */

                console.error(
                    error
                );


                $("loginStatus")
                    .textContent =
                    "Erro: " +
                    (
                        error.type ||
                        error.message
                    );
            }
        );


        /*
           Timeout.

           Se o PeerJS não responder,
           tenta entrar como cliente.
        */

        setTimeout(
            () => {

                if (decided) {
                    return;
                }


                decided = true;


                try {
                    hostAttempt.destroy();
                } catch {}


                becomeClient();

            },
            5000
        );
    };

/* =====================================================
   COMPARTILHAR TELA
===================================================== */

$("screenBtn").onclick =
    async () => {

        /*
           Se já está transmitindo,
           para.
        */

        if (screenEnabled) {

            stopScreenShare();

            return;
        }


        try {

            /*
               IMPORTANTE:

               getDisplayMedia precisa ser
               chamado diretamente pelo clique.
            */

            const stream =
                await navigator.mediaDevices
                    .getDisplayMedia({
                        video: {
                            cursor: "always"
                        },
                        audio: true
                    });


            /*
               Guarda a stream.
            */

            screenStream =
                stream;


            screenEnabled =
                true;


            $("screenBtn")
                .classList
                .add("active");


            /*
               Mostra sua própria tela.
            */

            showLocalStream(
                getOutgoingStream()
            );


            addSystemMessage(
                "Você começou a transmitir a tela."
            );


            setStatus(
                "🖥️ Transmitindo tela"
            );


            /*
               Detecta quando o usuário
               clica em "Parar compartilhamento"
               no Chrome.
            */

            const videoTrack =
                stream.getVideoTracks()[0];


            if (videoTrack) {

                videoTrack.onended =
                    () => {

                        if (
                            screenStream ===
                            stream
                        ) {

                            stopScreenShare(
                                false
                            );
                        }
                    };
            }


            /*
               Envia para TODOS.
            */

            renegotiateAll();


        } catch (error) {

            console.error(
                "SCREEN ERROR:",
                error
            );


            /*
               Cancelou o seletor.
            */

            if (
                error.name ===
                "AbortError"
            ) {

                setStatus(
                    "Compartilhamento cancelado."
                );

                return;
            }


            alert(
                "Erro ao compartilhar tela:\n" +
                error.message
            );
        }
    };


/* =====================================================
   PARAR TELA
===================================================== */

function stopScreenShare() {

    const oldStream =
        screenStream;


    screenStream =
        null;


    screenEnabled =
        false;


    $("screenBtn")
        .classList
        .remove("active");


    if (oldStream) {

        for (
            const track
            of oldStream.getTracks()
        ) {

            try {
                track.stop();
            } catch {}
        }
    }


    /*
       Se houver câmera,
       volta para ela.
    */

    showLocalStream(
        getOutgoingStream()
    );


    /*
       Atualiza todos.
    */

    renegotiateAll();


    addSystemMessage(
        "Você parou a transmissão."
    );


    setStatus(
        "Transmissão encerrada."
    );
}
